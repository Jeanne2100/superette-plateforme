      <div class="p-5 border-b border-border"><h2 class="font-display font-semibold text-base">Historique des ventes (${sales.length})</h2></div>
      <table class="data w-full">
        <thead><tr><th>Reçu</th><th>Date</th><th>Caissier</th><th>Articles</th><th>Paiement</th><th>Total</th><th></th></tr></thead>
        <tbody>${sales.map(s => `<tr>
          <td class="font-mono">${s.code}</td>
          <td class="text-ink-600">${fmtDateTime(s.createdAt)}</td>
          <td class="text-ink-600">${s.userName || DB.users.find(u => u.id === s.userId)?.name || "—"}</td>
          <td class="text-ink-600">${s.items.length}</td>
          <td class="text-ink-600">${paymentLabel(s.paymentMethod)}</td>
          <td class="font-mono font-semibold">${fmtGNF(s.total)}</td>
          <td class="text-right"><button class="btn-ghost !px-2 !py-1" onclick="printReceipt('${s.id}')">Reçu</button></td>
        </tr>`).join("")}</tbody>
      </table>
    </div>`;
}
function paymentLabel(m) {
  return { ESPECES: "Espèces", MOBILE_MONEY: "Mobile Money", CARTE: "Carte bancaire" }[m] || m;
}
async function printReceipt(saleId) {
  const s = DB.sales.find(x => x.id === saleId);
  const c = DB.company || DEFAULT_COMPANY;
  const pr = c.printer || DEFAULT_COMPANY.printer;
  const isA4 = pr.type === "A4";
  const width = isA4 ? 800 : (pr.type === "POS58" ? 380 : 420);

  // Fenêtre ouverte de façon SYNCHRONE (même clic) pour éviter le blocage popup, remplie ensuite.
  const win = window.open("", "_blank", `width=${width},height=700`);
  if (!win) { toast("Le navigateur a bloqué la fenêtre d'impression. Autorise les popups puis réessaie.", "danger"); return; }
  win.document.write(`<html><head><title>Reçu ${s.code}</title></head><body style="font-family:sans-serif;padding:24px;color:#475467;">Génération du reçu…</body></html>`);
  win.document.close();

  let qrDataUrl = null;
  if (pr.showQr) {
    try {
      const canvas = document.createElement("canvas");
      await QRCode.toCanvas(canvas, JSON.stringify({ sale: s.code, total: s.total }), { width: 200, margin: 4, errorCorrectionLevel: "M" });
      qrDataUrl = canvas.toDataURL("image/png");
    } catch (err) {
      console.error(`[Reçu] Échec génération QR pour le reçu ${s.code} :`, err);
    }
  }

  const thermalWidth = pr.type === "POS58" ? "48mm" : "70mm"; // largeur imprimable (hors marges) pour 58mm / 80mm
  const style = isA4 ? `
      body{font-family:Arial,sans-serif;padding:20mm;font-size:12px;color:#101828;}
      h2{font-size:20px;margin:0 0 4px;} p.sub{margin:0 0 3px;color:#555;font-size:12px;}
      img.rlogo{max-height:60px;margin-bottom:8px;}
      table{width:100%;border-collapse:collapse;margin:14px 0;} th,td{padding:6px 4px;font-size:12px;border-bottom:1px solid #E6EAF2;text-align:left;}
      .right{text-align:right;} .totalrow{font-weight:bold;font-size:15px;} .line{border-top:1px solid #E6EAF2;margin:10px 0;}
      @page{size:A4;margin:15mm;}
    ` : `
      body{font-family:'Courier New',monospace;padding:3mm;font-size:12px;color:#111;width:${thermalWidth};}
      h2{text-align:center;margin:0 0 2px;font-size:15px;} p.sub{text-align:center;margin:0 0 2px;color:#333;font-size:10.5px;}
      img.rlogo{display:block;margin:0 auto 6px;max-height:40px;}
      img.rqr{display:block;margin:8px auto 4px;width:26mm;height:26mm;}
      table{width:100%;border-collapse:collapse;margin-bottom:8px;} td{padding:2px 0;font-size:11px;}
      .line{border-top:1px dashed #999;margin:6px 0;} .right{text-align:right;} .totalrow{font-weight:bold;font-size:13px;}
      @page{size:${pr.type === "POS58" ? "58mm" : "80mm"} auto;margin:2mm;}
    `;

  const itemsHtml = isA4
    ? `<table><thead><tr><th>Produit</th><th class="right">Qté</th><th class="right">P.U.</th><th class="right">Total</th></tr></thead>
        <tbody>${s.items.map(i => `<tr><td>${i.productName}</td><td class="right">${i.quantity}</td><td class="right">${fmtGNF(i.unitPrice)}</td><td class="right">${fmtGNF(i.subtotal)}</td></tr>`).join("")}</tbody></table>`
    : `<table>${s.items.map(i => `<tr><td colspan="2">${i.productName}</td></tr><tr><td>${i.quantity} x ${fmtGNF(i.unitPrice)}</td><td class="right">${fmtGNF(i.subtotal)}</td></tr>`).join("")}</table>`;

  win.document.open();
  win.document.write(`
    <html><head><title>Reçu ${s.code}</title><style>${style}</style></head><body>
    ${pr.showLogo && c.logo ? `<img class="rlogo" src="${c.logo}" />` : ""}
    ${pr.showName ? `<h2>${(c.name || "SUPÉRETTE").toUpperCase()}</h2>` : ""}
    ${pr.showAddress && (c.address || c.city) ? `<p class="sub">${[c.address, c.city].filter(Boolean).join(", ")}</p>` : ""}
    ${pr.showPhone && c.phone ? `<p class="sub">Tél : ${c.phone}</p>` : ""}
    ${pr.showTaxIds && (c.rccm || c.nif) ? `<p class="sub">${[c.rccm ? `RCCM : ${c.rccm}` : "", c.nif ? `NIF : ${c.nif}` : ""].filter(Boolean).join(" — ")}</p>` : ""}
    ${pr.showTicketNumber || pr.showDateTime ? `<p class="sub" style="margin-top:8px;">${pr.showTicketNumber ? `Reçu ${s.code}` : ""}${pr.showTicketNumber && pr.showDateTime ? " — " : ""}${pr.showDateTime ? fmtDateTime(s.createdAt) : ""}</p>` : ""}
    ${pr.showCashier ? `<p class="sub">Caissier : ${s.userName || ""}</p>` : ""}
    <div class="line"></div>
    ${itemsHtml}
    <div class="line"></div>
    <table>
      <tr><td>Sous-total</td><td class="right">${fmtGNF(s.subtotal)}</td></tr>
      ${s.discount ? `<tr><td>Remise</td><td class="right">-${fmtGNF(s.discount)}</td></tr>` : ""}
      ${s.tax ? `<tr><td>TVA</td><td class="right">${fmtGNF(s.tax)}</td></tr>` : ""}
      <tr class="totalrow"><td>TOTAL</td><td class="right">${fmtGNF(s.total)}</td></tr>
      ${s.isCredit ? `<tr><td>Payé</td><td class="right">${fmtGNF(sumPayments(s))}</td></tr><tr><td>Reste à payer</td><td class="right">${fmtGNF(s.total - sumPayments(s))}</td></tr>` : ""}
    </table>
    <div class="line"></div>
    <p class="sub">Paiement : ${s.isCredit ? "Vente à crédit" : paymentLabel(s.paymentMethod)}</p>
    ${qrDataUrl ? `<img class="rqr" src="${qrDataUrl}" />` : ""}
    ${c.slogan ? `<p class="sub" style="margin-top:8px;font-style:italic;">${c.slogan}</p>` : ""}
    ${pr.showThanks ? `<p class="sub">Merci de votre visite !</p>` : ""}
    ${pr.showTerms && pr.termsText ? `<p class="sub" style="margin-top:6px;">${pr.termsText}</p>` : ""}
    <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  win.document.close();
}
</script>
<script>
/* ============================================================
   RAPPORTS & ANALYSES
   ============================================================ */
let REPORT_PERIOD = "today";
let REPORT_CUSTOM_START = "";
let REPORT_CUSTOM_END = "";
let REPORT_FILTERS = { userId: "", clientId: "", productId: "", categoryId: "", paymentMethod: "" };

function startOfWeek(d) { const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day; const r = new Date(d); r.setDate(d.getDate() + diff); r.setHours(0, 0, 0, 0); return r; }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfQuarter(d) { return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1); }
function startOfSemester(d) { return new Date(d.getFullYear(), d.getMonth() < 6 ? 0 : 6, 1); }
function startOfYear(d) { return new Date(d.getFullYear(), 0, 1); }

const REPORT_PERIOD_LABELS = {
  today: "Aujourd'hui", week: "Cette semaine", month: "Ce mois", quarter: "Ce trimestre",
  semester: "Ce semestre", year: "Cette année", custom: "Période personnalisée",
};

function getPeriodRange(key) {
  const now = new Date();
  let start;
  switch (key) {
    case "today": start = todayStart(); break;
    case "week": start = startOfWeek(now); break;
    case "month": start = startOfMonth(now); break;
    case "quarter": start = startOfQuarter(now); break;
    case "semester": start = startOfSemester(now); break;
    case "year": start = startOfYear(now); break;
    case "custom": start = REPORT_CUSTOM_START ? new Date(REPORT_CUSTOM_START + "T00:00:00") : todayStart(); break;
    default: start = todayStart();
  }
  let end = now;
  if (key === "custom" && REPORT_CUSTOM_END) end = new Date(REPORT_CUSTOM_END + "T23:59:59");
  const durationMs = Math.max(1, end - start);
  const prevEnd = new Date(start.getTime() - 1);
  const prevStart = new Date(prevEnd.getTime() - durationMs);
  return { start, end, prevStart, prevEnd };
}

function salesInRange(start, end) {
  return DB.sales.filter(s => { const d = new Date(s.createdAt); return d >= start && d <= end; });
}
function applyReportFilters(sales) {
  const f = REPORT_FILTERS;
  return sales.filter(s => {
    if (f.userId && s.userId !== f.userId) return false;
    if (f.clientId && s.clientId !== f.clientId) return false;
    if (f.paymentMethod && s.paymentMethod !== f.paymentMethod) return false;
    if (f.productId && !s.items.some(i => i.productId === f.productId)) return false;
    if (f.categoryId) {
      const ids = DB.products.filter(p => p.categoryId === f.categoryId).map(p => p.id);
      if (!s.items.some(i => ids.includes(i.productId))) return false;
    }
    return true;
  });
}
function computeReportStats(sales) {
  const valid = sales.filter(s => s.status === "VALIDEE");
  const revenue = valid.reduce((s, x) => s + x.total, 0);
  const salesCount = valid.length;
  const productsSold = valid.reduce((s, x) => s + x.items.reduce((a, i) => a + i.quantity, 0), 0);
  const avgBasket = salesCount ? revenue / salesCount : 0;
  const grossMargin = valid.reduce((sum, sale) => sum + sale.items.reduce((acc, item) => {
    const product = DB.products.find(p => p.id === item.productId);
    const cost = (product?.purchasePrice ?? 0) * item.quantity;
    return acc + (item.subtotal - cost);
  }, 0), 0);
  const totalDiscount = valid.reduce((s, x) => s + (x.discount || 0), 0);
  return { revenue, salesCount, productsSold, avgBasket, grossMargin, totalDiscount };
}
function computeEmployeeStats(sales) {
  const byUser = {};
  sales.filter(s => s.status === "VALIDEE").forEach(s => {
    const uid = s.userId;
    if (!byUser[uid]) byUser[uid] = { userId: uid, name: s.userName || DB.users.find(u => u.id === uid)?.name || "—", salesCount: 0, revenue: 0, profit: 0, discount: 0, productsSold: 0 };
    const b = byUser[uid];
    b.salesCount++; b.revenue += s.total; b.discount += (s.discount || 0);
    b.productsSold += s.items.reduce((a, i) => a + i.quantity, 0);
    b.profit += s.items.reduce((acc, item) => {
      const product = DB.products.find(p => p.id === item.productId);
      const cost = (product?.purchasePrice ?? 0) * item.quantity;
      return acc + (item.subtotal - cost);
    }, 0);
  });
  return Object.values(byUser).sort((a, b) => b.revenue - a.revenue);
}
function computeTopProducts(sales, limit = 10) {
  const byProduct = {};
  sales.filter(s => s.status === "VALIDEE").forEach(s => s.items.forEach(item => {
    if (!byProduct[item.productId]) byProduct[item.productId] = { name: item.productName, qty: 0, revenue: 0 };
    byProduct[item.productId].qty += item.quantity;
    byProduct[item.productId].revenue += item.subtotal;
  }));
  return Object.values(byProduct).sort((a, b) => b.revenue - a.revenue).slice(0, limit);
}
function bucketSalesForChart(sales, start, end) {
  const days = Math.ceil((end - start) / 86400000);
  let bucketKey, labelFn;
  if (days <= 31) { bucketKey = d => d.toDateString(); labelFn = d => d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }); }
  else if (days <= 460) { bucketKey = d => `${d.getFullYear()}-${d.getMonth()}`; labelFn = d => d.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" }); }
  else { bucketKey = d => `${d.getFullYear()}`; labelFn = d => `${d.getFullYear()}`; }
  const map = new Map();
  sales.filter(s => s.status === "VALIDEE").forEach(s => {
    const d = new Date(s.createdAt);
    const key = bucketKey(d);
    if (!map.has(key)) map.set(key, { label: labelFn(d), total: 0, sortKey: d.getTime() });
    map.get(key).total += s.total;
  });
  return [...map.values()].sort((a, b) => a.sortKey - b.sortKey);
}
function evolutionPct(current, previous) {
  if (!previous) return current > 0 ? null : 0;
  return ((current - previous) / previous) * 100;
}

function renderRapports() {
  const root = document.getElementById("page-root");
  const { start, end, prevStart, prevEnd } = getPeriodRange(REPORT_PERIOD);
  const rangeSales = applyReportFilters(salesInRange(start, end));
  const prevRangeSales = applyReportFilters(salesInRange(prevStart, prevEnd));
  const stats = computeReportStats(rangeSales);
  const prevStats = computeReportStats(prevRangeSales);
  const employees = computeEmployeeStats(rangeSales);
  const topProducts = computeTopProducts(rangeSales);
  const evoRevenue = evolutionPct(stats.revenue, prevStats.revenue);
  const evoLabel = (v) => v == null ? "—" : `${v >= 0 ? "▲" : "▼"} ${Math.abs(v).toFixed(1)}%`;
  const evoColor = (v) => v == null ? "text-ink-400" : (v >= 0 ? "text-accent-600" : "text-danger");
  const canFin = canSeeFinancials(CURRENT_USER);

  root.innerHTML = `
    <div class="space-y-4">
      <div class="card p-4">
        <div class="flex flex-wrap gap-2">
          ${["today", "week", "month", "quarter", "semester", "year", "custom"].map(k => `
            <button class="btn-ghost !px-3 !py-1.5 text-xs ${REPORT_PERIOD === k ? "!bg-navy-700 !text-white" : ""}" onclick="setReportPeriod('${k}')">${REPORT_PERIOD_LABELS[k]}</button>
          `).join("")}
        </div>
        ${REPORT_PERIOD === "custom" ? `
          <div class="flex flex-wrap items-end gap-3 mt-3 pt-3 border-t border-border">
            <div><label class="label">Du</label><input type="date" id="report-start" class="input" value="${REPORT_CUSTOM_START}" /></div>
            <div><label class="label">Au</label><input type="date" id="report-end" class="input" value="${REPORT_CUSTOM_END}" /></div>
            <button class="btn-primary !py-2" onclick="applyReportCustomRange()">Appliquer</button>
          </div>` : ""}
      </div>

      <div class="card p-4">
        <h2 class="font-display font-semibold text-sm mb-3">Recherche avancée</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
          <div><label class="label">Employé</label><select id="report-f-user" class="input">
            <option value="">Tous</option>${DB.users.map(u => `<option value="${u.id}" ${REPORT_FILTERS.userId === u.id ? "selected" : ""}>${u.name}</option>`).join("")}
          </select></div>
          <div><label class="label">Client</label><select id="report-f-client" class="input">
            <option value="">Tous</option>${DB.clients.map(c => `<option value="${c.id}" ${REPORT_FILTERS.clientId === c.id ? "selected" : ""}>${c.name}</option>`).join("")}
          </select></div>
          <div><label class="label">Produit</label><select id="report-f-product" class="input">
            <option value="">Tous</option>${DB.products.map(p => `<option value="${p.id}" ${REPORT_FILTERS.productId === p.id ? "selected" : ""}>${p.name}</option>`).join("")}
          </select></div>
          <div><label class="label">Catégorie</label><select id="report-f-category" class="input">
            <option value="">Toutes</option>${DB.categories.map(c => `<option value="${c.id}" ${REPORT_FILTERS.categoryId === c.id ? "selected" : ""}>${c.name}</option>`).join("")}
          </select></div>
          <div><label class="label">Mode de paiement</label><select id="report-f-payment" class="input">
            <option value="">Tous</option>
            <option value="ESPECES" ${REPORT_FILTERS.paymentMethod === "ESPECES" ? "selected" : ""}>Espèces</option>
            <option value="MOBILE_MONEY" ${REPORT_FILTERS.paymentMethod === "MOBILE_MONEY" ? "selected" : ""}>Mobile Money</option>
            <option value="CARTE" ${REPORT_FILTERS.paymentMethod === "CARTE" ? "selected" : ""}>Carte bancaire</option>
          </select></div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card p-5"><p class="text-xs font-medium text-ink-600 mb-2">Chiffre d'affaires</p><p class="font-mono font-semibold text-2xl">${fmtGNF(stats.revenue)}</p><p class="text-xs mt-1.5 ${evoColor(evoRevenue)}">${evoLabel(evoRevenue)} vs période précédente</p></div>
        <div class="card p-5"><p class="text-xs font-medium text-ink-600 mb-2">Ventes</p><p class="font-mono font-semibold text-2xl">${stats.salesCount}</p><p class="text-xs text-ink-400 mt-1.5">${stats.productsSold} produit(s) vendu(s)</p></div>
        <div class="card p-5"><p class="text-xs font-medium text-ink-600 mb-2">Panier moyen</p><p class="font-mono font-semibold text-2xl">${fmtGNF(Math.round(stats.avgBasket))}</p></div>
        ${canFin ? `
        <div class="card p-5"><p class="text-xs font-medium text-ink-600 mb-2">Marge brute / bénéfice estimé</p><p class="font-mono font-semibold text-2xl">${fmtGNF(Math.round(stats.grossMargin))}</p><p class="text-xs text-ink-400 mt-1.5">Remises accordées : ${fmtGNF(stats.totalDiscount)}</p></div>` : `
        <div class="card p-5"><p class="text-xs font-medium text-ink-600 mb-2">Marge brute / bénéfice estimé</p><p class="font-mono font-semibold text-lg text-ink-400">🔒 Masqué</p></div>`}
      </div>

      <div class="card p-5">
        <h2 class="font-display font-semibold text-sm mb-4">Évolution des ventes — ${REPORT_PERIOD_LABELS[REPORT_PERIOD]}</h2>
        <canvas id="reportChart" height="90"></canvas>
      </div>

      <div class="card">
        <div class="p-5 border-b border-border flex items-center justify-between">
          <h2 class="font-display font-semibold text-base">Performance par employé</h2>
        </div>
        <table class="data w-full">
          <thead><tr><th>#</th><th>Employé</th><th>Ventes</th><th>Produits vendus</th><th>Chiffre d'affaires</th>${canFin ? "<th>Bénéfice</th>" : ""}<th>Remises</th><th>Annulations</th><th>Retours</th></tr></thead>
          <tbody>${employees.length === 0 ? `<tr><td colspan="${canFin ? 9 : 8}" class="text-center text-ink-400 py-6">Aucune vente sur cette période.</td></tr>` : employees.map((e, i) => `
            <tr>
              <td class="font-mono text-ink-400">${i + 1}</td>
              <td>${e.name}</td>
              <td class="font-mono">${e.salesCount}</td>
              <td class="font-mono">${e.productsSold}</td>
              <td class="font-mono font-semibold">${fmtGNF(e.revenue)}</td>
              ${canFin ? `<td class="font-mono">${fmtGNF(Math.round(e.profit))}</td>` : ""}
              <td class="font-mono">${fmtGNF(e.discount)}</td>
              <td class="font-mono text-ink-400">0</td>
              <td class="font-mono text-ink-400">0</td>
            </tr>`).join("")}</tbody>
        </table>
        <p class="text-xs text-ink-400 px-5 py-3 border-t border-border">Annulations et retours : ce module n'existe pas encore dans le point de vente actuel (aucune vente n'est aujourd'hui annulable ou retournable) — ces colonnes afficheront des valeurs réelles dès qu'un tel workflow sera ajouté au POS.</p>
      </div>

      <div class="card">
        <div class="p-5 border-b border-border"><h2 class="font-display font-semibold text-base">🏆 Classement des meilleurs vendeurs (produits)</h2></div>
        <table class="data w-full">
          <thead><tr><th>#</th><th>Produit</th><th>Quantité vendue</th><th>Chiffre d'affaires</th></tr></thead>
          <tbody>${topProducts.length === 0 ? `<tr><td colspan="4" class="text-center text-ink-400 py-6">Aucune vente sur cette période.</td></tr>` : topProducts.map((p, i) => `
            <tr><td class="font-mono text-ink-400">${i + 1}</td><td>${p.name}</td><td class="font-mono">${p.qty}</td><td class="font-mono font-semibold">${fmtGNF(p.revenue)}</td></tr>`).join("")}</tbody>
        </table>
      </div>

      <div class="card">
        <div class="p-5 border-b border-border flex flex-wrap items-center justify-between gap-3">
          <h2 class="font-display font-semibold text-base">Détail des ventes (${rangeSales.length})</h2>
          <div class="flex flex-wrap gap-2">
            <button class="btn-ghost" onclick="printReport()">🖨️ Imprimer</button>
            <button class="btn-ghost" onclick="exportReportCsv()">⬇️ CSV</button>
            <button class="btn-ghost" onclick="exportReportXlsx()">⬇️ Excel (.xlsx)</button>
            <button class="btn-primary" onclick="exportReportPdf()">⬇️ PDF</button>
          </div>
        </div>
        <div class="max-h-96 overflow-y-auto">
          <table class="data w-full">
            <thead><tr><th>Reçu</th><th>Date</th><th>Employé</th><th>Client</th><th>Paiement</th><th>Remise</th><th>Total</th></tr></thead>
            <tbody>${rangeSales.length === 0 ? `<tr><td colspan="7" class="text-center text-ink-400 py-6">Aucune vente sur cette période.</td></tr>` : [...rangeSales].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(s => `
              <tr>
                <td class="font-mono">${s.code}</td>
                <td class="text-ink-600">${fmtDateTime(s.createdAt)}</td>
                <td class="text-ink-600">${s.userName || "—"}</td>
                <td class="text-ink-600">${DB.clients.find(c => c.id === s.clientId)?.name || "—"}</td>
                <td class="text-ink-600">${paymentLabel(s.paymentMethod)}</td>
                <td class="font-mono">${s.discount ? fmtGNF(s.discount) : "—"}</td>
                <td class="font-mono font-semibold">${fmtGNF(s.total)}</td>
              </tr>`).join("")}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  ["user", "client", "product", "category", "payment"].forEach(key => {
    document.getElementById(`report-f-${key}`).addEventListener("change", (e) => {
      const map = { user: "userId", client: "clientId", product: "productId", category: "categoryId", payment: "paymentMethod" };
      REPORT_FILTERS[map[key]] = e.target.value;
      renderRapports();
    });
  });

  const chartData = bucketSalesForChart(rangeSales, start, end);
  if (window._reportChart) window._reportChart.destroy();
  if (typeof Chart !== "undefined") {
    window._reportChart = new Chart(document.getElementById("reportChart"), {
      type: "bar",
      data: { labels: chartData.map(b => b.label), datasets: [{ data: chartData.map(b => b.total), backgroundColor: "#1E3A5F", borderRadius: 4 }] },
      options: {
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmtGNF(c.parsed.y) } } },
        scales: { x: { grid: { display: false }, ticks: { color: "#98A2B3", font: { size: 11 } } }, y: { grid: { color: "#E6EAF2" }, ticks: { color: "#98A2B3", font: { size: 11 } } } }
      }
    });
  } else {
    document.getElementById("reportChart").outerHTML = `<p class="text-sm text-ink-400">Chart.js n'a pas pu être chargé depuis le CDN (vérifie la connexion Internet) — le graphique ne peut pas s'afficher, mais les chiffres ci-dessus restent exacts.</p>`;
  }
}

function setReportPeriod(key) { REPORT_PERIOD = key; renderRapports(); }
function applyReportCustomRange() {
  REPORT_CUSTOM_START = document.getElementById("report-start").value;
  REPORT_CUSTOM_END = document.getElementById("report-end").value;
  if (!REPORT_CUSTOM_START || !REPORT_CUSTOM_END) return toast("Sélectionne une date de début et de fin.", "danger");
  renderRapports();
}

function currentReportRows() {
  const { start, end } = getPeriodRange(REPORT_PERIOD);
  return [...applyReportFilters(salesInRange(start, end))].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
}
function printReport() {
  const { start, end } = getPeriodRange(REPORT_PERIOD);
  const stats = computeReportStats(currentReportRows());
  const c = DB.company || DEFAULT_COMPANY;
  const rows = currentReportRows();
  const win = window.open("", "_blank", "width=900,height=700");
  if (!win) { toast("Le navigateur a bloqué la fenêtre d'impression. Autorise les popups puis réessaie.", "danger"); return; }
  win.document.write(`<html><head><title>Rapport</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#101828;}
      h1{font-size:18px;margin:0 0 2px;} p.meta{color:#667085;font-size:12px;margin:2px 0;}
      img.logo{max-height:48px;margin-bottom:8px;}
      table{width:100%;border-collapse:collapse;margin-top:16px;} th,td{border-bottom:1px solid #E6EAF2;text-align:left;padding:6px 8px;font-size:12px;}
      th{color:#98A2B3;text-transform:uppercase;font-size:10px;} .totals{margin-top:14px;font-size:13px;} footer{margin-top:24px;font-size:11px;color:#98A2B3;}
    </style></head><body>
    ${c.logo ? `<img class="logo" src="${c.logo}" />` : ""}
    <h1>${(c.name || "Supérette").toUpperCase()} — Rapport des ventes</h1>
    <p class="meta">Période : ${REPORT_PERIOD_LABELS[REPORT_PERIOD]} (${fmtDate(start)} → ${fmtDate(end)})</p>
    <p class="meta">Généré le ${fmtDateTime(new Date().toISOString())} par ${CURRENT_USER.name}</p>
    <div class="totals">
      <p><strong>Chiffre d'affaires :</strong> ${fmtGNF(stats.revenue)} · <strong>Ventes :</strong> ${stats.salesCount} · <strong>Panier moyen :</strong> ${fmtGNF(Math.round(stats.avgBasket))} · <strong>Marge brute :</strong> ${fmtGNF(Math.round(stats.grossMargin))}</p>
    </div>
    <table><thead><tr><th>Reçu</th><th>Date</th><th>Employé</th><th>Paiement</th><th>Remise</th><th>Total</th></tr></thead>
      <tbody>${rows.map(s => `<tr><td>${s.code}</td><td>${fmtDateTime(s.createdAt)}</td><td>${s.userName || ""}</td><td>${paymentLabel(s.paymentMethod)}</td><td>${s.discount ? fmtGNF(s.discount) : "—"}</td><td>${fmtGNF(s.total)}</td></tr>`).join("")}</tbody>
    </table>
    <footer>${c.name || "Supérette"} — ${[c.address, c.city].filter(Boolean).join(", ")}</footer>
    <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  win.document.close();
}
function exportReportCsv() {
  const rows = currentReportRows();
  const header = ["Reçu", "Date", "Employé", "Client", "Paiement", "Remise", "Total"];
  const lines = [header.join(";")];
  rows.forEach(s => {
    lines.push([s.code, fmtDateTime(s.createdAt), s.userName || "", DB.clients.find(c => c.id === s.clientId)?.name || "", paymentLabel(s.paymentMethod), s.discount || 0, s.total].map(v => `"${String(v).replace(/"/g, '""')}"`).join(";"));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `rapport-ventes-${REPORT_PERIOD}-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Export CSV téléchargé.");
}
function exportReportXlsx() {
  if (typeof XLSX === "undefined") {
    reportError("export Excel", "XLSX (SheetJS) non chargée — vérifie la connexion Internet (chargée depuis un CDN) puis réessaie.");
    return;
  }
  const rows = currentReportRows().map(s => ({
    Reçu: s.code, Date: fmtDateTime(s.createdAt), Employé: s.userName || "", Client: DB.clients.find(c => c.id === s.clientId)?.name || "",
    Paiement: paymentLabel(s.paymentMethod), Remise: s.discount || 0, Total: s.total,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ventes");
  XLSX.writeFile(wb, `rapport-ventes-${REPORT_PERIOD}-${Date.now()}.xlsx`);
  toast("Export Excel téléchargé.");
}
function exportReportPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) { reportError("export PDF", "jsPDF non chargée — vérifie la connexion Internet (chargée depuis un CDN) puis réessaie."); return; }
  const { start, end } = getPeriodRange(REPORT_PERIOD);
  const stats = computeReportStats(currentReportRows());
  const rows = currentReportRows();
  const c = DB.company || DEFAULT_COMPANY;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4" });
  let y = 15;
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(14);
  pdf.text(`${(c.name || "Supérette").toUpperCase()} — Rapport des ventes`, 14, y); y += 6;
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(100);
  pdf.text(`Période : ${REPORT_PERIOD_LABELS[REPORT_PERIOD]} (${fmtDate(start)} -> ${fmtDate(end)})`, 14, y); y += 5;
  pdf.text(`Généré le ${fmtDateTime(new Date().toISOString())} par ${CURRENT_USER.name}`, 14, y); y += 7;
  pdf.setTextColor(20); pdf.setFont("helvetica", "bold"); pdf.setFontSize(10);
  pdf.text(`CA : ${fmtGNF(stats.revenue)}   Ventes : ${stats.salesCount}   Panier moyen : ${fmtGNF(Math.round(stats.avgBasket))}   Marge : ${fmtGNF(Math.round(stats.grossMargin))}`, 14, y); y += 8;
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(8);
  const cols = [14, 44, 84, 114, 144, 164, 184];
  ["Reçu", "Date", "Employé", "Paiement", "Remise", "Total"].forEach((h, i) => pdf.text(h, cols[i], y));
  y += 2; pdf.setDrawColor(220); pdf.line(14, y, 196, y); y += 4;
  pdf.setFont("helvetica", "normal");
  rows.forEach(s => {
    if (y > 285) { pdf.addPage(); y = 15; }
    pdf.text(String(s.code), cols[0], y);
    pdf.text(fmtDateTime(s.createdAt), cols[1], y);
    pdf.text(String(s.userName || "").slice(0, 16), cols[2], y);
    pdf.text(paymentLabel(s.paymentMethod), cols[3], y);
    pdf.text(s.discount ? fmtGNF(s.discount) : "—", cols[4], y);
    pdf.text(fmtGNF(s.total), cols[5], y);
    y += 5;
  });
  pdf.setFontSize(7); pdf.setTextColor(150);
  pdf.text(`${c.name || "Supérette"} — ${[c.address, c.city].filter(Boolean).join(", ")}`, 14, 292);
  pdf.save(`rapport-ventes-${REPORT_PERIOD}-${Date.now()}.pdf`);
  toast("Export PDF téléchargé.");
}
</script>
<script>
/* ============================================================
   CAISSE (POINT DE VENTE)
   ============================================================ */
let CAISSE_SEARCH = "";

function renderCaisse() {
  const root = document.getElementById("page-root");
  root.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
      <div class="lg:col-span-2 space-y-4">
        <div class="card p-4">
          <div class="flex gap-2">
            <input id="caisse-search" class="input" placeholder="Rechercher un produit ou saisir/coller un code QR..." value="${CAISSE_SEARCH}" />
            <button class="btn-accent whitespace-nowrap" onclick="openScannerModal()">📷 Scanner</button>
          </div>
          <div id="caisse-not-found" class="hidden mt-2 flex items-center justify-between gap-3 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
            <p class="text-sm text-danger">Produit introuvable.</p>
            <button id="caisse-create-from-search" class="btn-ghost !py-1 !px-2 text-xs shrink-0 hidden" onclick="createProductFromSearch()">+ Créer un nouveau produit</button>
          </div>
        </div>
        <div class="card p-4">
          <div id="caisse-product-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </div>
      </div>

      <div class="card p-4 lg:sticky lg:top-20">
        <h2 class="font-display font-semibold text-sm mb-3">Panier (<span id="cart-count">0</span>)</h2>
        <div id="cart-items" class="space-y-2 max-h-80 overflow-y-auto mb-3"></div>
        <div class="border-t border-border pt-3 space-y-2">
          <div><label class="label">Client (optionnel)</label>
            <select id="cart-client" class="input">
              <option value="">Vente comptant</option>
              ${DB.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="label">Remise (GNF)</label><input id="cart-discount" type="number" class="input" value="0" /></div>
            <div><label class="label">TVA (%)</label><input id="cart-tax" type="number" class="input" value="0" /></div>
          </div>
          <div><label class="label">Moyen de paiement</label>
            <select id="cart-payment" class="input">
              <option value="ESPECES">Espèces</option>
              <option value="MOBILE_MONEY">Mobile Money</option>
              <option value="CARTE">Carte bancaire</option>
            </select>
          </div>
          <label class="flex items-center gap-2 text-sm font-medium pt-1">
            <input type="checkbox" id="cart-is-credit" /> Vente à crédit
          </label>
          <div id="credit-fields" class="hidden space-y-2 border border-amber-300 bg-amber-50 rounded-lg p-3">
            <p class="text-xs text-amber-800">Le client sélectionné ci-dessus est obligatoire pour une vente à crédit.</p>
            <div><label class="label">Montant payé (GNF)</label><input id="cart-amount-paid" type="number" class="input" value="0" min="0" /></div>
            <div class="flex items-center justify-between text-sm"><span class="text-ink-600">Montant restant</span><span id="cart-amount-remaining" class="font-mono font-semibold">0 GNF</span></div>
            <div><label class="label">Date d'échéance (optionnel)</label><input id="cart-due-date" type="date" class="input" /></div>
            <div><label class="label">Observations (optionnel)</label><textarea id="cart-credit-notes" class="input" rows="2"></textarea></div>
          </div>
          <div class="flex items-center justify-between pt-2 text-sm"><span class="text-ink-600">Sous-total</span><span id="cart-subtotal" class="font-mono">0 GNF</span></div>
          <div class="flex items-center justify-between font-semibold text-base"><span>Total</span><span id="cart-total" class="font-mono">0 GNF</span></div>
          <button class="btn-accent w-full mt-2" onclick="validateSale()">Valider la vente</button>
        </div>
      </div>
    </div>

    <div id="credit-history-section"></div>`;

  document.getElementById("caisse-search").addEventListener("input", (e) => {
    // La saisie ne fait que filtrer la grille visuellement — la recherche/ajout au panier
    // se fait exclusivement sur Entrée (voir plus bas), comme sur une vraie caisse professionnelle.
    CAISSE_SEARCH = e.target.value;
    hideCaisseNotFound();
    renderProductGrid();
  });
  document.getElementById("caisse-search").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    searchAndAddToCart();
  });
  document.getElementById("caisse-search").focus();
  document.getElementById("cart-is-credit").addEventListener("change", (e) => {
    document.getElementById("credit-fields").classList.toggle("hidden", !e.target.checked);
    renderCart();
  });
  document.getElementById("cart-amount-paid").addEventListener("input", renderCart);
  renderProductGrid();
  renderCart();
  renderCreditHistory();
}

function renderProductGrid() {
  const grid = document.getElementById("caisse-product-grid");
  if (!grid) return;
  const canSeeStock = CURRENT_USER.role !== "CAISSIER";
  const list = DB.products.filter(p => p.isActive && p.quantity > 0 &&
    (p.name.toLowerCase().includes(CAISSE_SEARCH.toLowerCase()) || p.qrCode.toLowerCase().includes(CAISSE_SEARCH.toLowerCase())));
  grid.innerHTML = list.slice(0, 30).map(p => `
    <button onclick="addToCart('${p.id}')" class="text-left border border-border rounded-lg overflow-hidden bg-white hover:border-navy-400 hover:shadow-card active:scale-[0.98] transition-all">
      <div class="w-full aspect-square bg-navy-50 overflow-hidden">
        <img src="${p.imageUrl || DEFAULT_PRODUCT_IMAGE}" class="w-full h-full object-cover" loading="lazy" />
      </div>
      <div class="p-2.5">
        <p class="text-sm font-medium leading-tight line-clamp-2 min-h-[2.4em]">${p.name}</p>
        <p class="text-[11px] text-ink-400 font-mono mt-1">${p.qrCode}</p>
        <div class="flex items-center justify-between mt-1.5">
          <p class="font-mono text-sm font-semibold">${fmtGNF(p.sellingPrice)}</p>
          ${canSeeStock ? `<p class="text-[11px] text-ink-400 shrink-0 ml-1">${p.quantity} ${p.unit}</p>` : ""}
        </div>
      </div>
    </button>`).join("") || `<p class="col-span-full text-sm text-ink-400 text-center py-6">Aucun produit trouvé.</p>`;
}

// ---- Recherche par scan (douchette USB/Bluetooth/2.4GHz, scanner QR/code-barres) ou saisie manuelle ----
// Entrée est le SEUL déclencheur de recherche : jamais d'ouverture automatique du formulaire de création,
// jamais d'ajout accidentel pendant la frappe. Le champ reste focus après chaque action pour scanner en continu.
function searchAndAddToCart() {
  const input = document.getElementById("caisse-search");
  const raw = CAISSE_SEARCH.trim();
  hideCaisseNotFound();
  if (!raw) return;

  const code = extractQrCode(raw);
  const exact = DB.products.find(p => p.isActive && (p.qrCode.toLowerCase() === code.toLowerCase() || (p.barcode && p.barcode.toLowerCase() === code.toLowerCase())));

  if (exact) {
    addToCart(exact.id); // incrémente automatiquement la quantité si le produit est déjà dans le panier
    input.value = ""; CAISSE_SEARCH = "";
    renderProductGrid();
  } else {
    console.warn(`[Scanner] Code introuvable : "${raw}" (saisi/scanné le ${new Date().toLocaleString("fr-FR")} par ${CURRENT_USER.name})`);
    showCaisseNotFound(raw);
  }
  input.focus(); // le champ reste actif pour continuer à scanner sans souris
}
function showCaisseNotFound(rawCode) {
  const panel = document.getElementById("caisse-not-found");
  const createBtn = document.getElementById("caisse-create-from-search");
  panel.classList.remove("hidden");
  panel.dataset.rawCode = rawCode;
  createBtn.classList.toggle("hidden", CURRENT_USER.role === "CAISSIER");
}
function hideCaisseNotFound() {
  document.getElementById("caisse-not-found")?.classList.add("hidden");
}
// Action volontaire uniquement (clic explicite) — la création n'est jamais déclenchée automatiquement par Entrée
function createProductFromSearch() {
  hideCaisseNotFound();
  document.getElementById("caisse-search").value = ""; CAISSE_SEARCH = "";
  openProductForm(null);
}

function addToCart(productId) {
  const product = DB.products.find(p => p.id === productId && p.isActive);
  if (!product) return toast("Produit introuvable pour ce code.", "danger");
  if (product.quantity <= 0) return toast("Stock épuisé pour ce produit.", "danger");
  const line = CART.find(l => l.productId === productId);
  if (line) {
    if (line.quantity + 1 > product.quantity) return toast("Quantité disponible dépassée.", "danger");
    line.quantity += 1;
  } else {
    CART.push({ productId, quantity: 1 });
  }
  renderCart();
  toast(`${product.name} ajouté.`);
}
function updateCartQty(productId, delta) {
  const product = DB.products.find(p => p.id === productId);
  const line = CART.find(l => l.productId === productId);
  if (!line) return;
  const next = line.quantity + delta;
  if (next <= 0) { CART = CART.filter(l => l.productId !== productId); }
  else if (next > product.quantity) { toast("Quantité disponible dépassée.", "danger"); return; }
  else { line.quantity = next; }
  renderCart();
}
function removeFromCart(productId) {
  CART = CART.filter(l => l.productId !== productId);
  renderCart();
}
function renderCart() {
  const container = document.getElementById("cart-items");
  if (!container) return;
  document.getElementById("cart-count").textContent = CART.reduce((s, l) => s + l.quantity, 0);
  if (CART.length === 0) {
    container.innerHTML = `<p class="text-sm text-ink-400 text-center py-6">Panier vide. Scanne ou clique un produit.</p>`;
  } else {
    container.innerHTML = CART.map(l => {
      const p = DB.products.find(pr => pr.id === l.productId);
      return `<div class="flex items-center justify-between gap-2 text-sm">
        <div class="min-w-0"><p class="truncate font-medium">${p.name}</p><p class="text-xs text-ink-400 font-mono">${fmtGNF(p.sellingPrice)} x ${l.quantity}</p></div>
        <div class="flex items-center gap-1 shrink-0">
          <button class="w-6 h-6 rounded bg-navy-50 text-navy-700" onclick="updateCartQty('${l.productId}', -1)">−</button>
          <span class="font-mono w-5 text-center">${l.quantity}</span>
          <button class="w-6 h-6 rounded bg-navy-50 text-navy-700" onclick="updateCartQty('${l.productId}', 1)">+</button>
          <button class="ml-1 text-ink-400 hover:text-danger" onclick="removeFromCart('${l.productId}')">&times;</button>
        </div>
      </div>`;
    }).join("");
  }
  const subtotal = CART.reduce((s, l) => s + DB.products.find(p => p.id === l.productId).sellingPrice * l.quantity, 0);
  const discount = Number(document.getElementById("cart-discount")?.value || 0);
  const taxRate = Number(document.getElementById("cart-tax")?.value || 0);
  const taxedBase = Math.max(subtotal - discount, 0);
  const tax = (taxedBase * taxRate) / 100;
  const total = taxedBase + tax;
  document.getElementById("cart-subtotal").textContent = fmtGNF(subtotal);
  document.getElementById("cart-total").textContent = fmtGNF(total);

  const amountPaidEl = document.getElementById("cart-amount-paid");
  if (amountPaidEl) {
    const paid = Math.max(0, Number(amountPaidEl.value || 0));
    const remaining = Math.max(0, total - paid);
    document.getElementById("cart-amount-remaining").textContent = fmtGNF(remaining);
  }

  ["cart-discount", "cart-tax"].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el._bound) { el.addEventListener("input", renderCart); el._bound = true; }
  });
}

async function validateSale() {
  if (CART.length === 0) return toast("Le panier est vide.", "danger");
  for (const line of CART) {
    const p = DB.products.find(pr => pr.id === line.productId);
    if (!p || p.quantity < line.quantity) return toast(`Stock insuffisant pour "${p?.name}".`, "danger");
  }
  const discount = Number(document.getElementById("cart-discount").value || 0);
  const taxRate = Number(document.getElementById("cart-tax").value || 0);
  const paymentMethod = document.getElementById("cart-payment").value;
  const clientId = document.getElementById("cart-client").value || null;

  const isCredit = document.getElementById("cart-is-credit").checked;
  let amountPaid, dueDate = null, creditNotes = "";
  if (isCredit) {
    if (!clientId) return toast("Sélectionne un client — obligatoire pour une vente à crédit.", "danger");
    amountPaid = Math.max(0, Number(document.getElementById("cart-amount-paid").value || 0));
    dueDate = document.getElementById("cart-due-date").value || null;
    creditNotes = document.getElementById("cart-credit-notes").value.trim();
  }

  const items = CART.map(l => ({ productId: l.productId, quantity: l.quantity }));

  try {
    // Le backend gère tout, en une seule transaction : baisse de stock, création de la vente, paiement
    // initial et créance client (voir backend/src/routes/sales.js) — jamais de perte de cohérence possible.
    const sale = await Api.sales.create({ items, clientId, discount, taxRate, paymentMethod, isCredit, amountPaid, dueDate, notes: creditNotes });
    DB.sales.push(sale); // affichage/impression immédiats sans dépendre de la permission "ventes"
    DB.products = await Api.products.list();
    if (clientId) DB.clients = await Api.clients.list();

    CART = [];
    LAST_SALE_ID = sale.id;
    toast(isCredit ? "Vente à crédit enregistrée avec succès." : "Vente enregistrée avec succès.");
    printReceipt(sale.id);
    renderCaisse();
  } catch (err) {
    toast(err.message, "danger");
  }
}

// ---- Ventes à crédit : solde, statut, historique des paiements ----
function sumPayments(sale) { return (sale.payments || []).reduce((s, p) => s + p.amount, 0); }
function creditRemaining(sale) { return Math.max(0, sale.total - sumPayments(sale)); }
function creditStatusOf(sale) {
  const remaining = creditRemaining(sale);
  if (remaining <= 0) return "PAYE";
  if (sumPayments(sale) > 0) return "PARTIEL";
  return "IMPAYE";
}
function creditStatusLabel(status) {
  return { PAYE: "Payé", PARTIEL: "Partiellement payé", IMPAYE: "Impayé" }[status] || status;
}
function creditStatusBadgeClass(status) {
  return { PAYE: "bg-green-50 text-green-700", PARTIEL: "bg-amber-50 text-amber-700", IMPAYE: "bg-red-50 text-danger" }[status] || "";
}

function renderCreditHistory() {
  const root = document.getElementById("credit-history-section");
  if (!root) return;
  const creditSales = DB.sales.filter(s => s.isCredit).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (creditSales.length === 0) { root.innerHTML = ""; return; }
  root.innerHTML = `
    <div class="card mt-4">
      <div class="p-4 border-b border-border"><h2 class="font-display font-semibold text-sm">Ventes à crédit (${creditSales.length})</h2></div>
      <table class="data w-full">
        <thead><tr><th>Reçu</th><th>Client</th><th>Montant initial</th><th>Payé</th><th>Solde restant</th><th>Échéance</th><th>Statut</th><th></th></tr></thead>
        <tbody>${creditSales.map(s => {
          const client = DB.clients.find(c => c.id === s.clientId);
          const remaining = creditRemaining(s);
          const status = creditStatusOf(s);
          return `<tr>
            <td class="font-mono">${s.code}</td>
            <td>${client?.name || "—"}</td>
            <td class="font-mono">${fmtGNF(s.total)}</td>
            <td class="font-mono">${fmtGNF(sumPayments(s))}</td>
            <td class="font-mono font-semibold">${fmtGNF(remaining)}</td>
            <td class="text-ink-400">${s.dueDate ? fmtDate(s.dueDate) : "—"}</td>
            <td><span class="text-xs px-2 py-0.5 rounded-full ${creditStatusBadgeClass(status)}">${creditStatusLabel(status)}</span></td>
            <td>${remaining > 0 ? `<button class="btn-ghost !px-2 !py-1 text-xs" onclick="openCreditPaymentModal('${s.id}')">Enregistrer un paiement</button>` : ""}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;
}

function openCreditPaymentModal(saleId) {
  const sale = DB.sales.find(s => s.id === saleId);
  const remaining = creditRemaining(sale);
  openModal("Enregistrer un paiement", `
    <div class="space-y-3">
      <p class="text-sm text-ink-600">Reçu <span class="font-mono">${sale.code}</span> — solde restant : <span class="font-semibold">${fmtGNF(remaining)}</span></p>
      <div><label class="label">Montant payé (GNF)</label><input id="f-payment-amount" type="number" class="input" value="${remaining}" min="1" max="${remaining}" /></div>
      <div class="flex justify-end gap-2 pt-2">
        <button class="btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="recordCreditPayment('${sale.id}')">Enregistrer</button>
      </div>
    </div>`, { size: "max-w-sm" });
}

async function recordCreditPayment(saleId) {
  const sale = DB.sales.find(s => s.id === saleId);
  if (!sale) return;
  const amount = Number(document.getElementById("f-payment-amount").value || 0);
  const remaining = creditRemaining(sale);
  if (amount <= 0) return toast("Le montant doit être supérieur à zéro.", "danger");
  if (amount > remaining) return toast("Le montant dépasse le solde restant.", "danger");
  try {
    const payment = await Api.sales.addPayment(saleId, amount);
    sale.payments = sale.payments || [];
    sale.payments.push(payment);
    if (sale.clientId) DB.clients = await Api.clients.list();
    closeModal();
    toast("Paiement enregistré.");
    renderCreditHistory();
  } catch (err) {
    toast(err.message, "danger");
  }
}

/* ============================================================
   SCAN CAMÉRA (QR)
   ============================================================ */
function openScannerModal() {
  openModal("Scanner un code QR", `
    <div id="qr-reader" style="width:100%"></div>
    <p class="text-xs text-ink-400 mt-3">Autorise l'accès à la caméra. Le produit sera ajouté automatiquement au panier dès qu'un code est reconnu.</p>
  `);
  startScanner();
}
function startScanner() {
  try {
    SCANNER = new Html5Qrcode("qr-reader");
    SCANNER.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (decodedText) => {
        const code = extractQrCode(decodedText);
        const product = DB.products.find(p => p.isActive && p.qrCode === code);
        if (product) {
          addToCart(product.id);
          closeModal();
        } else {
          toast("Code QR non reconnu.", "danger");
        }
      },
      () => {}
    ).catch(() => {
      document.getElementById("qr-reader").innerHTML = `<p class="text-sm text-danger">Impossible d'accéder à la caméra. Vérifie les autorisations du navigateur, ou saisis le code manuellement dans la barre de recherche.</p>`;
    });
  } catch (e) {
    document.getElementById("qr-reader").innerHTML = `<p class="text-sm text-danger">Scanner indisponible sur cet appareil. Saisis le code manuellement.</p>`;
  }
}
function stopScanner() {
  if (SCANNER) {
    try { SCANNER.stop().then(() => SCANNER.clear()).catch(() => {}); } catch (e) {}
    SCANNER = null;
  }
}
</script>
<script>
/* ============================================================
   INITIALISATION
   ============================================================ */
// MODE DEBUG — diagnostic des bibliothèques au démarrage. Le moteur QR est écrit en interne
// (toujours présent, jamais chargé depuis un CDN) ; les autres bibliothèques sont chargées
// depuis un CDN public (nécessite une connexion Internet, garantie sur un hébergement en ligne).
function runStartupDiagnostics() {
  console.log(`✔ Moteur QR : ${QRCode.VERSION} — toujours disponible, 100% interne, aucune dépendance réseau.`);
  const libs = [
    { name: "Tailwind CSS", test: () => typeof tailwind !== "undefined", file: "CDN" },
    { name: "html5-qrcode (scanner caméra)", test: () => typeof Html5Qrcode !== "undefined", file: "CDN" },
    { name: "Chart.js (graphiques du tableau de bord)", test: () => typeof Chart !== "undefined", file: "CDN" },
    { name: "JsBarcode (codes-barres)", test: () => typeof JsBarcode !== "undefined", file: "CDN" },
    { name: "jsPDF (export PDF des étiquettes et rapports)", test: () => !!(window.jspdf && window.jspdf.jsPDF), file: "CDN" },
    { name: "SheetJS / xlsx (export Excel des rapports)", test: () => typeof XLSX !== "undefined", file: "CDN" },
  ];
  const missing = [];
  libs.forEach(lib => {
    if (lib.test()) console.log(`✔ ${lib.name} : chargée (${lib.file})`);
    else { console.error(`✘ ${lib.name} : INTROUVABLE — dépose le fichier attendu dans ${lib.file} (à côté de ce HTML).`); missing.push(lib); }
  });
  if (missing.length) {
    toast(`${missing.length} bibliothèque(s) externe(s) non chargée(s) (CDN) — vérifie la connexion Internet. Voir la console (F12) pour le détail.`, "danger");
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  runStartupDiagnostics();
  setupMobileSidebarToggles();
  setupKeyboardShortcuts();
  document.getElementById("login-password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleLogin();
  });

  // Branding de l'écran de connexion : lecture publique des paramètres (pas besoin d'être connecté).
  try { DB.company = { ...DEFAULT_COMPANY, ...(await Api.settings.get()) }; } catch (err) { /* API indisponible : on garde les valeurs par défaut */ }
  applyCompanyBranding();
  await populateLoginUsers();

  // Restauration de session : un jeton déjà valide (précédente connexion, page rafraîchie) permet de
  // rester connecté sans ressaisir le mot de passe — remplace l'ancien sessionStorage basé sur l'ID utilisateur.
  if (AUTH_TOKEN) {
    try {
      const { user } = await Api.me();
      CURRENT_USER = user;
      await showApp();
    } catch (err) {
      Api.logout(); // jeton expiré/invalide : retour à l'écran de connexion normalement
    }
  }
});
</script>
<script>
/* ============================================================
   RACCOURCIS CLAVIER PROFESSIONNELS
   ------------------------------------------------------------
   Configuration pilotée par données : pour modifier/ajouter un raccourci plus tard,
   il suffit d'éditer cet objet (touche -> { action, label, description }) — aucune
   logique à toucher ailleurs. `action` est le nom d'une fonction définie plus bas
   dans SHORTCUT_ACTIONS.
   ============================================================ */
const KEYBOARD_SHORTCUTS = {
  F2: { action: "focusProductSearch", label: "F2", description: "Ouvrir la recherche de produits (bascule vers la Caisse)" },
  F3: { action: "focusProductSearch", label: "F3", description: "Placer le curseur dans la recherche" },
  F4: { action: "checkoutSale", label: "F4", description: "Encaisser la vente" },
  F5: { action: "newClient", label: "F5", description: "Ajouter un nouveau client" },
  F6: { action: "openSalesHistory", label: "F6", description: "Ouvrir l'historique des ventes" },
  F7: { action: "newProduct", label: "F7", description: "Ajouter un nouveau produit" },
  F8: { action: "openProductsPage", label: "F8", description: "Ouvrir la gestion des produits" },
  F9: { action: "focusDiscount", label: "F9", description: "Appliquer une remise (si autorisée)" },
  F10: { action: "printLastTicket", label: "F10", description: "Imprimer le dernier ticket" },
  F11: { action: "toggleFullscreen", label: "F11", description: "Basculer en mode plein écran" },
  Escape: { action: "closeActive", label: "Échap", description: "Fermer la fenêtre active" },
};

const SHORTCUT_ACTIONS = {
  focusProductSearch() {
    if (document.getElementById("page-root").querySelector("#caisse-search")) {
      document.getElementById("caisse-search").focus();
      document.getElementById("caisse-search").select();
    } else if (canSeePage(CURRENT_USER, "caisse")) {
      navigate("caisse");
      setTimeout(() => document.getElementById("caisse-search")?.focus(), 0);
    }
  },
  checkoutSale() {
    if (document.getElementById("page-root").querySelector("#caisse-search")) validateSale();
  },
  newClient() {
    if (canSeePage(CURRENT_USER, "clients") || document.getElementById("cart-client")) openClientForm();
  },
  openSalesHistory() {
    if (canSeePage(CURRENT_USER, "ventes")) navigate("ventes");
  },
  newProduct() {
    if (CURRENT_USER.role !== "CAISSIER" && canSeePage(CURRENT_USER, "produits")) openProductForm(null);
  },
  openProductsPage() {
    if (canSeePage(CURRENT_USER, "produits")) navigate("produits");
  },
  focusDiscount() {
    const el = document.getElementById("cart-discount");
    if (el) { el.focus(); el.select(); }
  },
  printLastTicket() {
    if (LAST_SALE_ID) printReceipt(LAST_SALE_ID);
    else toast("Aucun ticket à imprimer pour le moment.", "danger");
  },
  toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  },
  closeActive() {
    if (!document.getElementById("modal-backdrop").classList.contains("hidden")) { closeModal(); return; }
    if (!document.getElementById("sidebar").classList.contains("-translate-x-full")) { closeMobileSidebar(); return; }
    hideCaisseNotFound();
  },
};

function setupKeyboardShortcuts() {
  document.addEventListener("keydown", (e) => {
    const shortcut = KEYBOARD_SHORTCUTS[e.key];
    if (!shortcut) return;
    if (document.getElementById("screen-app").classList.contains("hidden")) return; // pas connecté : raccourcis inactifs
    // Aucune touche F ni Échap n'insère de caractère : les activer même quand le curseur est dans un
    // champ (recherche, remise...) est voulu — c'est justement là qu'un caissier professionnel les utilise
    // (ex. scanner un produit puis appuyer sur F4 sans quitter le champ de recherche).
    e.preventDefault();
    SHORTCUT_ACTIONS[shortcut.action]?.();
  });
}
</script>

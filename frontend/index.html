<script>
/* ============================================================
   MOTEUR QR CODE 100% INTERNE — AUCUNE DÉPENDANCE RÉSEAU / CDN
   ------------------------------------------------------------
   Remplace l'ancienne dépendance à qrcode.min.js chargée depuis un CDN
   (cause du message "QRCode.js manquant" en environnement hors ligne :
   un <script src="https://..."> ne se charge jamais sans connexion
   Internet — voir diagnostic complet dans la réponse fournie à l'équipe).
   Implémentation vanille, sans dépendance : mode Octet (Byte), Reed-Solomon
   sur GF(256) calculé algorithmiquement (aucune table binaire codée en dur),
   versions QR 1 à 6 (niveau de correction M), masque fixe n°0 — un choix de
   masque valide à 100% (le format info encode le masque réellement utilisé,
   donc la lisibilité par un scanner n'est absolument pas affectée par ce choix).
   Structure vérifiée manuellement (motifs de repérage, timing, alignement,
   bits de format) avant intégration.
   ============================================================ */
const QRCode = (function () {
  const VERSION_LABEL = "Supérette-QR-Engine 1.0.0 (interne, hors ligne)";

  // ---- GF(256) : tables calculées à l'exécution, aucune donnée binaire codée en dur ----
  const EXP = new Array(512);
  const LOG = new Array(256);
  (function initGF() {
    let x = 1;
    for (let i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11D; // polynôme primitif standard QR : x^8+x^4+x^3+x^2+1
    }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function rsGeneratorPoly(ecCount) {
    let g = [1];
    for (let i = 0; i < ecCount; i++) {
      const next = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) {
        next[j] ^= gmul(g[j], 1);
        next[j + 1] ^= gmul(g[j], EXP[i]);
      }
      g = next;
    }
    return g;
  }
  function rsEncode(dataCodewords, ecCount) {
    const gen = rsGeneratorPoly(ecCount);
    const buf = dataCodewords.concat(new Array(ecCount).fill(0));
    for (let i = 0; i < dataCodewords.length; i++) {
      const coef = buf[i];
      if (coef === 0) continue;
      for (let j = 0; j < gen.length; j++) buf[i + j] ^= gmul(gen[j], coef);
    }
    return buf.slice(dataCodewords.length);
  }

  // Table des blocs Reed-Solomon — niveau de correction M uniquement, versions 1 à 6
  // (format [nombre de blocs, total codewords/bloc, codewords de données/bloc], vérifiée par
  // cohérence interne : totalCodewords(version) = Σ(blocs × total) doit correspondre aux
  // capacités standard 26/44/70/100/134/172 — c'est bien le cas ici)
  const RS_BLOCK_TABLE_M = {
    1: [[1, 26, 16]], 2: [[1, 44, 28]], 3: [[1, 70, 44]],
    4: [[2, 50, 32]], 5: [[2, 67, 43]], 6: [[4, 43, 27]],
  };
  const ALIGNMENT_POS = { 1: null, 2: 18, 3: 22, 4: 26, 5: 30, 6: 34 };

  function pickVersion(byteLength) {
    for (let v = 1; v <= 6; v++) {
      const totalData = RS_BLOCK_TABLE_M[v].reduce((s, [n, , d]) => s + n * d, 0);
      if (byteLength <= totalData - 2) return v; // -2 : marge mode(4b)+longueur(8b)+terminateur
    }
    return null; // au-delà de la version 6 (~105 octets) : l'appelant doit utiliser un payload plus court
  }

  function buildCodewords(version, bytes) {
    const groups = RS_BLOCK_TABLE_M[version];
    const totalData = groups.reduce((s, [n, , d]) => s + n * d, 0);
    const bits = [];
    const pushBits = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    pushBits(0b0100, 4); // indicateur de mode : Octet (Byte)
    pushBits(bytes.length, 8); // indicateur de longueur (8 bits, valide pour versions 1-9)
    for (const b of bytes) pushBits(b, 8);
    // Garde-fou : si le contenu dépasse la capacité réelle de cette version, on ÉCHOUE bruyamment plutôt que
    // de tronquer silencieusement le dernier octet (c'est précisément ce genre de troncature silencieuse
    // qui a été corrigée : jamais de perte de caractère sans erreur explicite).
    if (bits.length > totalData * 8) {
      throw new Error(`Capacité dépassée pour la version ${version} (${bytes.length} octets encodés, ${Math.ceil(bits.length / 8)} nécessaires, ${totalData} disponibles).`);
    }
    for (let i = 0; i < 4 && bits.length < totalData * 8; i++) bits.push(0); // terminateur
    while (bits.length % 8 !== 0) bits.push(0);
    const dataBytes = [];
    for (let i = 0; i < bits.length; i += 8) {
      let byte = 0;
      for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
      dataBytes.push(byte);
    }
    const PAD = [0xEC, 0x11];
    for (let p = 0; dataBytes.length < totalData; p++) dataBytes.push(PAD[p % 2]);

    const blocks = [];
    let offset = 0;
    for (const [count, total, dataCount] of groups) {
      const ecCount = total - dataCount;
      for (let i = 0; i < count; i++) {
        const dataPart = dataBytes.slice(offset, offset + dataCount);
        offset += dataCount;
        blocks.push({ data: dataPart, ec: rsEncode(dataPart, ecCount) });
      }
    }
    const maxData = Math.max(...blocks.map(b => b.data.length));
    const maxEc = Math.max(...blocks.map(b => b.ec.length));
    const out = [];
    for (let i = 0; i < maxData; i++) for (const b of blocks) if (i < b.data.length) out.push(b.data[i]);
    for (let i = 0; i < maxEc; i++) for (const b of blocks) if (i < b.ec.length) out.push(b.ec[i]);
    return out;
  }

  function buildMatrix(version, codewords) {
    const size = version * 4 + 17;
    const modules = Array.from({ length: size }, () => new Array(size).fill(null));
    const reserved = Array.from({ length: size }, () => new Array(size).fill(false));
    function set(r, c, val) { if (r >= 0 && r < size && c >= 0 && c < size) { modules[r][c] = val; reserved[r][c] = true; } }

    function placeFinder(r0, c0) {
      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
        const rr = r0 + r, cc = c0 + c;
        if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
        const isBorder = r === -1 || r === 7 || c === -1 || c === 7;
        let val = false;
        if (!isBorder) {
          const ring = Math.max(Math.abs(r - 3), Math.abs(c - 3));
          val = ring !== 2; // bordure + centre 3x3 sombres, anneau intermédiaire clair
        }
        set(rr, cc, val);
      }
    }
    placeFinder(0, 0); placeFinder(0, size - 7); placeFinder(size - 7, 0);

    for (let i = 8; i < size - 8; i++) {
      if (!reserved[6][i]) set(6, i, i % 2 === 0);
      if (!reserved[i][6]) set(i, 6, i % 2 === 0);
    }
    const ap = ALIGNMENT_POS[version];
    if (ap) for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++) set(ap + r, ap + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
    set(size - 8, 8, true); // module sombre fixe

    for (let i = 0; i <= 8; i++) { reserved[8][i] = true; reserved[i][8] = true; }
    for (let i = 0; i <= 7; i++) reserved[8][size - 1 - i] = true;
    for (let i = 0; i <= 6; i++) reserved[size - 1 - i][8] = true;

    const bitsTotal = codewords.length * 8;
    let bitIndex = 0, row = size - 1, dir = -1;
    for (let col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      while (true) {
        for (let c = 0; c < 2; c++) {
          const cc = col - c;
          if (!reserved[row][cc]) {
            let bit = 0;
            if (bitIndex < bitsTotal) bit = (codewords[Math.floor(bitIndex / 8)] >>> (7 - (bitIndex % 8))) & 1;
            const maskBit = (row + cc) % 2 === 0 ? 1 : 0; // masque n°0 fixe
            modules[row][cc] = (bit ^ maskBit) === 1;
            bitIndex++;
          }
        }
        row += dir;
        if (row < 0 || row >= size) { row -= dir; dir = -dir; break; }
      }
    }

    // Bits de format : niveau EC=M (00) + masque=000, codés en BCH(15,5) — calculé, pas codé en dur
    const G15 = 0x537, G15_MASK = 0x5412;
    function bchDigit(n) { let d = 0; while (n !== 0) { d++; n >>>= 1; } return d; }
    const d0 = 0 << 10;
    let d = d0;
    while (bchDigit(d) - bchDigit(G15) >= 0) d ^= (G15 << (bchDigit(d) - bchDigit(G15)));
    const fmt = (d0 | d) ^ G15_MASK;
    const fbits = []; for (let i = 14; i >= 0; i--) fbits.push((fmt >>> i) & 1);
    for (let i = 0; i <= 5; i++) modules[8][i] = fbits[i] === 1;
    modules[8][7] = fbits[6] === 1; modules[8][8] = fbits[7] === 1; modules[7][8] = fbits[8] === 1;
    for (let i = 9; i <= 14; i++) modules[14 - i][8] = fbits[i] === 1;
    for (let i = 0; i <= 7; i++) modules[8][size - 1 - i] = fbits[i] === 1;
    for (let i = 8; i <= 14; i++) modules[size - 15 + i][8] = fbits[i] === 1;
    modules[size - 8][8] = true;

    return modules;
  }

  function encodeMatrix(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    const version = pickVersion(bytes.length);
    if (!version) return null; // payload trop long pour ce moteur (>~105 octets) — l'appelant doit réduire le contenu
    return buildMatrix(version, buildCodewords(version, bytes));
  }

  function drawToCanvas(canvas, matrix, opts) {
    const size = matrix.length;
    const margin = opts && opts.margin != null ? opts.margin : 4;
    const targetWidth = (opts && opts.width) || 256;
    const moduleSize = Math.max(1, Math.floor(targetWidth / (size + margin * 2)));
    const pixelSize = moduleSize * (size + margin * 2);
    canvas.width = pixelSize; canvas.height = pixelSize;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, pixelSize, pixelSize);
    ctx.fillStyle = "#000000";
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (matrix[r][c]) ctx.fillRect((c + margin) * moduleSize, (r + margin) * moduleSize, moduleSize, moduleSize);
      }
    }
  }

  // API compatible avec l'usage existant dans l'application : QRCode.toCanvas(canvas, text, opts) -> Promise
  async function toCanvas(canvas, text, opts) {
    const t0 = performance.now();
    if (opts && opts.errorCorrectionLevel && opts.errorCorrectionLevel !== "M") {
      console.warn(`[QR moteur interne] Niveau de correction "${opts.errorCorrectionLevel}" non supporté par le moteur hors ligne — niveau M utilisé à la place.`);
    }
    const matrix = encodeMatrix(text);
    if (!matrix) {
      const err = new Error(`Payload trop long pour le moteur QR interne (max ~105 octets, reçu ${new TextEncoder().encode(text).length} octets).`);
      console.error(`[QR moteur interne] Échec — ${err.message}`);
      throw err;
    }
    drawToCanvas(canvas, matrix, opts);
    const dt = (performance.now() - t0).toFixed(2);
    console.log(`✔ Bibliothèque QR : ${VERSION_LABEL} · ✔ Temps de génération : ${dt} ms · ✔ Taille matrice : ${matrix.length}×${matrix.length}`);
    return canvas;
  }

  return { toCanvas, VERSION: VERSION_LABEL };
})();
</script>

<script>
/* ============================================================
   COUCHE DONNÉES — client API vers le backend (PostgreSQL centralisé).
   Remplace l'ancien stockage localStorage : toutes les données sont désormais partagées
   entre tous les appareils/utilisateurs via cette API sécurisée (JWT + bcrypt côté serveur).
   ============================================================ */
// Adresse du backend déployé (Render/Railway...) — à renseigner une fois le backend en ligne.
// Adresse du backend déployé Render
const API_BASE_URL = "https://superette-plateforme.onrender.com";

let AUTH_TOKEN = sessionStorage.getItem("superette_api_token") || null;

async function apiRequest(method, path, body) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    method,
    headers: { "Content-Type": "application/json", ...(AUTH_TOKEN ? { Authorization: `Bearer ${AUTH_TOKEN}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && data.error) || `Erreur réseau (${res.status})`);
  return data;
}

const Api = {
  async login(email, password) {
    const { token, user } = await apiRequest("POST", "/api/auth/login", { email, password });
    AUTH_TOKEN = token;
    sessionStorage.setItem("superette_api_token", token);
    return user;
  },
  logout() { AUTH_TOKEN = null; sessionStorage.removeItem("superette_api_token"); },
  me: () => apiRequest("GET", "/api/auth/me"),
  products: {
    list: () => apiRequest("GET", "/api/products"),
    create: (p) => apiRequest("POST", "/api/products", p),
    update: (id, p) => apiRequest("PUT", `/api/products/${id}`, p),
    remove: (id) => apiRequest("DELETE", `/api/products/${id}`),
  },
  categories: {
    list: () => apiRequest("GET", "/api/categories"),
    create: (c) => apiRequest("POST", "/api/categories", c),
    update: (id, c) => apiRequest("PUT", `/api/categories/${id}`, c),
    remove: (id) => apiRequest("DELETE", `/api/categories/${id}`),
  },
  suppliers: {
    list: () => apiRequest("GET", "/api/suppliers"),
    create: (s) => apiRequest("POST", "/api/suppliers", s),
    update: (id, s) => apiRequest("PUT", `/api/suppliers/${id}`, s),
    remove: (id) => apiRequest("DELETE", `/api/suppliers/${id}`),
  },
  clients: {
    list: () => apiRequest("GET", "/api/clients"),
    create: (c) => apiRequest("POST", "/api/clients", c),
    update: (id, c) => apiRequest("PUT", `/api/clients/${id}`, c),
    remove: (id) => apiRequest("DELETE", `/api/clients/${id}`),
  },
  sales: {
    list: () => apiRequest("GET", "/api/sales"),
    create: (sale) => apiRequest("POST", "/api/sales", sale),
    addPayment: (saleId, amount) => apiRequest("POST", `/api/sales/${saleId}/payments`, { amount }),
    reportSummary: (start, end) => apiRequest("GET", `/api/sales/reports/summary?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`),
  },
  stockMovements: {
    list: (productId) => apiRequest("GET", `/api/stock-movements${productId ? `?productId=${productId}` : ""}`),
    adjust: (productId, type, quantity, reason) => apiRequest("POST", "/api/stock-movements", { productId, type, quantity, reason }),
  },
  settings: {

function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
}
function genQrValue() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "PRD-";
  for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
// Extrait le code produit d'un texte scanné/collé : accepte un QR "intelligent" (JSON {qr:"..."})
// ou un ancien code brut, pour garder la compatibilité du scanner avec les deux formats.
function extractQrCode(raw) {
  const trimmed = (raw || "").trim();
  try {
    const parsed = JSON.parse(trimmed);
    // "sku" est le champ actuel des QR produits (voir buildQrPayload) ; "qr" reste accepté
    // pour rester compatible avec d'anciennes étiquettes déjà imprimées avant ce renommage.
    if (parsed && (parsed.sku || parsed.qr)) return parsed.sku || parsed.qr;
  } catch (e) { /* pas du JSON : code brut classique (SKU tapé/scanné, code-barres...) */ }
  return trimmed;
}
function fmtGNF(v) {
  return `${new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 }).format(v || 0)} GNF`;
}
function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtDateTime(iso) {
  return new Date(iso).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function todayStart() {
  const d = new Date(); d.setHours(0, 0, 0, 0); return d;
}

// Recharge l'intégralité du cache local DB.* depuis l'API — appelé après connexion, et après toute
// opération qui doit rester visible immédiatement sur tous les appareils après actualisation.
// Chaque ressource est chargée indépendamment (pas de Promise.all global) : un utilisateur sans la
// permission "ventes" (ex. un Caissier) ne doit pas empêcher le reste des données de se charger.
async function loadAllData() {
  const safe = async (fn, fallback) => { try { return await fn(); } catch (err) { return fallback; } };
  DB.categories = await safe(() => Api.categories.list(), []);
  DB.products = await safe(() => Api.products.list(), []);
  DB.clients = await safe(() => Api.clients.list(), []);
  DB.suppliers = await safe(() => Api.suppliers.list(), []);
  DB.sales = await safe(() => Api.sales.list(), []); // vide si l'utilisateur n'a pas la permission "ventes"
  const settings = await safe(() => Api.settings.get(), {});
  DB.company = { ...DEFAULT_COMPANY, ...settings, printer: { ...DEFAULT_COMPANY.printer, ...(settings.printer || {}) } };
  if (canSeePage(CURRENT_USER, "utilisateurs")) DB.users = await safe(() => Api.users.list(), []);
}

  { key: "utilisateurs", label: "Utilisateurs & Rôles" }, { key: "parametres", label: "Paramètres & Impression" },
];
// Pages que le Caissier ne doit JAMAIS pouvoir voir, quelle que soit la configuration donnée par l'admin.
const HARD_BLOCKED_PAGES = { CAISSIER: ["rapports", "parametres", "utilisateurs"] };
// Permissions par défaut à la création d'un compte, selon le rôle choisi.
const DEFAULT_PERMISSIONS_BY_ROLE = {
  ADMIN: PERMISSION_PAGES.map(p => p.key), // non utilisé en pratique : l'admin a toujours un accès total (voir canSeePage)
  GERANT: ["dashboard", "caisse", "ventes", "produits", "categories", "stock", "etiquettes", "clients", "fournisseurs"],
  CAISSIER: ["caisse", "clients"],
};

// L'administrateur a TOUJOURS un accès total et inconditionnel — jamais restreint, jamais configurable.
// (Le backend applique exactement la même règle — voir backend/src/permissions.js — donc un appel direct
// à l'API sans passer par ce menu est refusé de la même façon.)
function canSeePage(user, page) {
  if (user.role === "ADMIN") return true;
  const blocked = HARD_BLOCKED_PAGES[user.role] || [];
  if (blocked.includes(page)) return false; // verrouillé en dur, ignore toute permission enregistrée
  return (user.permissions || []).includes(page);
}
// Bénéfices, marges et chiffre d'affaires globaux : jamais visibles pour un Caissier (même règle qu'une page,
// mais s'applique DANS des pages déjà accessibles comme le Tableau de bord — donc vérifié séparément du menu).
function canSeeFinancials(user) {
  if (user.role === "ADMIN") return true;
  if (user.role === "CAISSIER") return false; // jamais, non configurable — exigence de sécurité explicite
  return (user.permissions || []).includes("financials");
}
async function handleLogin() {
  const userId = document.getElementById("login-user").value;

  if (!selected) { errEl.textContent = "Compte introuvable."; errEl.classList.remove("hidden"); return; }
  try {
    CURRENT_USER = await Api.login(selected.email, password);
    errEl.classList.add("hidden");
    await showApp();
  } catch (err) {
    errEl.textContent = err.message || "Mot de passe incorrect.";
    errEl.classList.remove("hidden");
  }
}

<script>
/* ============================================================

   ============================================================ */
function computeSummary() {
  const start = todayStart();
  const todaySales = DB.sales.filter(s => new Date(s.createdAt) >= start && s.status === "VALIDEE");
  console.log(todaySales);
   /* const revenueToday = todaySales.reduce((s, sale) => s + sale.total, 0); */
  const revenueToday = todaySales.reduce((sum, sale) => {
  return sum + Number(sale.total || 0);
}, 0);
  const profitToday = todaySales.reduce((sum, sale) => {
    const p = sale.items.reduce((acc, item) => {
      const product = DB.products.find(pr => pr.id === item.productId);
      const cost = (product?.purchasePrice ?? 0) * item.quantity;
      return acc + (item.subtotal - cost);
    }, 0);
    return sum + p;
  }, 0);
  const lowStock = DB.products.filter(p => p.isActive && p.quantity <= p.lowStockThreshold);
  const expired = DB.products.filter(p => p.isActive && p.expirationDate && new Date(p.expirationDate) < new Date());

  const salesByProduct = {};
  DB.sales.forEach(sale => sale.items.forEach(item => {
    if (!salesByProduct[item.productId]) salesByProduct[item.productId] = { name: item.productName, qty: 0, revenue: 0 };
    salesByProduct[item.productId].qty += item.quantity;
    salesByProduct[item.productId].revenue += item.subtotal;
  }));
  const topProducts = Object.values(salesByProduct).sort((a, b) => b.qty - a.qty).slice(0, 5);

  return { revenueToday, salesCountToday: todaySales.length, profitToday, lowStock, expired, topProducts };
}

          <ul class="divide-y divide-border text-sm">${s.expired.map(p => `<li class="flex items-center justify-between py-2.5"><span>${p.name}</span><span class="font-mono text-danger">${fmtDate(p.expirationDate)}</span></li>`).join("")}</ul>`}
        </div>
      </div>
    </div>`;

  if (!showFinancials) return; // pas de graphique financier à initialiser pour ce compte
  const labels = []; const values = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toDateString();
    labels.push(d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }));
    /* const total = DB.sales.filter(s2 => new Date(s2.createdAt).toDateString() === key).reduce((sum, s2) => sum + s2.total, 0); */

    const total = DB.sales
  .filter(s2 => new Date(s2.createdAt).toDateString() === key)
  .reduce((sum, s2) => sum + Number(s2.total || 0), 0);
    values.push(total);
  }
  if (window._chart) { window._chart.destroy(); }
  window._chart = new Chart(document.getElementById("trendChart"), {
    type: "line",
    data: { labels, datasets: [{ data: values, borderColor: "#1E3A5F", backgroundColor: "rgba(30,58,95,0.12)", fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 }] },
    options: {
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmtGNF(c.parsed.y) } } },
      scales: { x: { grid: { display: false }, ticks: { color: "#98A2B3", font: { size: 11 } } }, y: { grid: { color: "#E6EAF2" }, ticks: { color: "#98A2B3", font: { size: 11 } } } }
    }
  });
}

/* ============================================================
   CATÉGORIES
   ============================================================ */
function renderCategories() {
  const root = document.getElementById("page-root");
  const canEdit = CURRENT_USER.role !== "CAISSIER";
  root.innerHTML = `
    <div class="card">
      <div class="flex items-center justify-between p-5 border-b border-border">
        <h2 class="font-display font-semibold text-base">Catégories (${DB.categories.length})</h2>
        ${canEdit ? `<button class="btn-primary" onclick="openCategoryForm()">+ Nouvelle catégorie</button>` : ""}
      </div>
      <table class="data w-full">
        <thead><tr><th>Nom</th><th>Description</th><th>Produits</th><th></th></tr></thead>
        <tbody>${DB.categories.map(c => {
          const count = DB.products.filter(p => p.categoryId === c.id && p.isActive).length;
          return `<tr>
            <td class="font-medium">${c.name}</td>
            <td class="text-ink-600">${c.description || "—"}</td>
            <td class="font-mono">${count}</td>
            <td class="text-right">${canEdit ? `
              <button class="btn-ghost !px-2 !py-1" onclick='openCategoryForm(${JSON.stringify(c.id)})'>Modifier</button>
              <button class="btn-danger !px-2 !py-1" onclick="deleteCategory('${c.id}')">Supprimer</button>` : ""}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;
}
function openCategoryForm(id) {
  const cat = id ? DB.categories.find(c => c.id === id) : null;
  openModal(cat ? "Modifier la catégorie" : "Nouvelle catégorie", `
    <div class="space-y-4">
      <div><label class="label">Nom</label><input id="f-name" class="input" value="${cat?.name || ""}" /></div>
      <div><label class="label">Description</label><input id="f-desc" class="input" value="${cat?.description || ""}" /></div>
      <div class="flex justify-end gap-2 pt-2">
        <button class="btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="saveCategory(${id ? `'${id}'` : "null"})">Enregistrer</button>
      </div>
    </div>`);
}
async function saveCategory(id) {
  const name = document.getElementById("f-name").value.trim();
  const description = document.getElementById("f-desc").value.trim();
  if (!name) return toast("Le nom est requis.", "danger");
  try {
    if (id) await Api.categories.update(id, { name, description });
    else await Api.categories.create({ name, description });
    DB.categories = await Api.categories.list();
    closeModal(); toast("Catégorie enregistrée."); renderCategories();
  } catch (err) { toast(err.message, "danger"); }
}
async function deleteCategory(id) {
  const count = DB.products.filter(p => p.categoryId === id && p.isActive).length;
  if (count > 0) return toast(`Impossible : ${count} produit(s) rattaché(s).`, "danger");
  if (!confirm("Supprimer cette catégorie ?")) return;
  try {
    await Api.categories.remove(id);
    DB.categories = await Api.categories.list();
    toast("Catégorie supprimée."); renderCategories();
  } catch (err) { toast(err.message, "danger"); }
}

<script>
/* ============================================================
   PRODUITS
   ============================================================ */
let PRODUCT_SEARCH = "";
function renderProduits() {
  const root = document.getElementById("page-root");
  const canEdit = CURRENT_USER.role !== "CAISSIER";
  const list = DB.products.filter(p => p.isActive && p.name.toLowerCase().includes(PRODUCT_SEARCH.toLowerCase()));
  root.innerHTML = `
    <div class="card">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-5 border-b border-border">
        <h2 class="font-display font-semibold text-base">Produits (${list.length})</h2>
        <div class="flex items-center gap-2">
          <input id="product-search" class="input sm:w-64" placeholder="Rechercher un produit..." value="${PRODUCT_SEARCH}" />
          ${canEdit ? `<button class="btn-primary whitespace-nowrap" onclick="openProductForm()">+ Nouveau produit</button>` : ""}
        </div>
      </div>
      <table class="data w-full">
        <thead><tr><th>Image</th><th>QR</th><th>Nom</th><th>Catégorie</th><th>Achat</th><th>Vente</th><th>Stock</th><th></th></tr></thead>
        <tbody>${list.map(p => {
          const cat = DB.categories.find(c => c.id === p.categoryId);
          const low = p.quantity <= p.lowStockThreshold;
          const expired = p.expirationDate && new Date(p.expirationDate) < new Date();
          return `<tr>
            <td><img src="${p.imageUrl || DEFAULT_PRODUCT_IMAGE}" class="w-9 h-9 rounded object-cover border border-border" /></td>
            <td><canvas class="qr-thumb" data-qr="${p.qrCode}" width="36" height="36"></canvas></td>
            <td><p class="font-medium">${p.name}</p><p class="text-xs text-ink-400 font-mono">${p.qrCode}</p></td>
            <td class="text-ink-600">${cat?.name || "—"}</td>
            <td class="font-mono text-ink-600">${fmtGNF(p.purchasePrice)}</td>
            <td class="font-mono">${fmtGNF(p.sellingPrice)}</td>
            <td class="font-mono ${low ? "text-warning font-semibold" : ""}">${p.quantity} ${p.unit} ${expired ? '<span class="text-danger">· périmé</span>' : ""}</td>
            <td class="text-right whitespace-nowrap">
              <button class="btn-ghost !px-2 !py-1" onclick="printLabel('${p.id}')">Étiquette</button>
              ${canEdit ? `<button class="btn-ghost !px-2 !py-1" onclick='openProductForm(${JSON.stringify(p.id)})'>Modifier</button>
              <button class="btn-danger !px-2 !py-1" onclick="deleteProduct('${p.id}')">Supprimer</button>` : ""}
            </td>
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;
  document.getElementById("product-search").addEventListener("input", (e) => { PRODUCT_SEARCH = e.target.value; renderProduits(); });
  document.getElementById("product-search").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const code = extractQrCode(PRODUCT_SEARCH);
    const match = DB.products.find(p => p.isActive && (p.qrCode.toLowerCase() === code.toLowerCase() || (p.barcode && p.barcode.toLowerCase() === code.toLowerCase())));
    if (match) {
      PRODUCT_SEARCH = ""; renderProduits();
      openProductForm(match.id); // "Ouverture automatique de la fiche produit" après un scan (douchette USB/Bluetooth ou saisie manuelle du code)
    }
  });
  document.querySelectorAll(".qr-thumb").forEach(c => QRCode.toCanvas(c, c.dataset.qr, { width: 36, margin: 2 }));
}

let PRODUCT_IMAGE_PREVIEW = null; // Base64 temporaire pendant l'édition, avant enregistrement

function openProductForm(id) {
  const p = id ? DB.products.find(x => x.id === id) : null;
  PRODUCT_IMAGE_PREVIEW = p?.imageUrl || null;
  const catOptions = DB.categories.map(c => `<option value="${c.id}" ${p?.categoryId === c.id ? "selected" : ""}>${c.name}</option>`).join("");
  openModal(p ? "Modifier le produit" : "Nouveau produit", `
    <div class="flex items-center gap-4 mb-4">
      <div id="product-image-preview" class="w-20 h-20 rounded-lg border border-border overflow-hidden shrink-0 bg-navy-50">
        <img src="${p?.imageUrl || DEFAULT_PRODUCT_IMAGE}" class="w-full h-full object-cover" />
      </div>
      <div>
        <label class="label">Image du produit</label>
        <input id="f-image" type="file" accept="image/*" class="text-sm" />
        <button type="button" class="text-xs text-danger hover:underline mt-1.5 block" onclick="clearProductImage()">Supprimer l'image</button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2"><label class="label">Nom du produit</label><input id="f-name" class="input" value="${p?.name || ""}" /></div>
      <div><label class="label">Marque</label><input id="f-brand" class="input" value="${p?.brand || ""}" /></div>
      <div><label class="label">Catégorie</label><select id="f-cat" class="input">${catOptions}</select></div>
      <div><label class="label">Prix d'achat (GNF)</label><input id="f-purchase" type="number" class="input" value="${p?.purchasePrice ?? ""}" /></div>
      <div><label class="label">Prix de vente (GNF)</label><input id="f-sell" type="number" class="input" value="${p?.sellingPrice ?? ""}" /></div>
      <div><label class="label">Quantité en stock</label><input id="f-qty" type="number" class="input" value="${p?.quantity ?? 0}" /></div>
      <div><label class="label">Unité</label><input id="f-unit" class="input" value="${p?.unit || "unité"}" /></div>
      <div><label class="label">Seuil de stock faible</label><input id="f-threshold" type="number" class="input" value="${p?.lowStockThreshold ?? 5}" /></div>
      <div><label class="label">Date d'expiration (optionnel)</label><input id="f-exp" type="date" class="input" value="${p?.expirationDate ? p.expirationDate.slice(0,10) : ""}" /></div>
    </div>
    ${p ? `<p class="text-xs text-ink-400 font-mono mt-3">Code QR : ${p.qrCode} (généré automatiquement, non modifiable)</p>` : `<p class="text-xs text-ink-400 mt-3">Un code QR unique sera généré automatiquement à la création.</p>`}
    <div class="flex justify-end gap-2 pt-4">
      <button class="btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="saveProduct(${id ? `'${id}'` : "null"})">Enregistrer</button>
    </div>`, { size: "max-w-xl" });

  document.getElementById("f-image").addEventListener("change", (e) => {
    fileToBase64(e.target.files[0], (base64) => {
      if (!base64) return;
      PRODUCT_IMAGE_PREVIEW = base64;
      document.getElementById("product-image-preview").innerHTML = `<img src="${base64}" class="w-full h-full object-cover" />`;
    });
  });
}
function clearProductImage() {
  PRODUCT_IMAGE_PREVIEW = null;
  const preview = document.getElementById("product-image-preview");
  if (preview) preview.innerHTML = `<img src="${DEFAULT_PRODUCT_IMAGE}" class="w-full h-full object-cover" />`;
  const input = document.getElementById("f-image");
  if (input) input.value = "";
}
async function saveProduct(id) {
  const name = document.getElementById("f-name").value.trim();
  const categoryId = document.getElementById("f-cat").value;
  const purchasePrice = Number(document.getElementById("f-purchase").value);
  const sellingPrice = Number(document.getElementById("f-sell").value);
  const quantity = Number(document.getElementById("f-qty").value);
  const unit = document.getElementById("f-unit").value.trim() || "unité";
  const lowStockThreshold = Number(document.getElementById("f-threshold").value);
  const expRaw = document.getElementById("f-exp").value;
  const brand = document.getElementById("f-brand").value.trim();

  if (!name) return toast("Le nom est requis.", "danger");
  if (!categoryId) return toast("La catégorie est requise.", "danger");
  if (isNaN(purchasePrice) || isNaN(sellingPrice)) return toast("Prix invalides.", "danger");

  try {
    if (id) {
      const p = DB.products.find(x => x.id === id);
      await Api.products.update(id, { name, brand, categoryId, purchasePrice, sellingPrice, quantity, unit,
        lowStockThreshold, expirationDate: expRaw ? new Date(expRaw).toISOString() : null, imageUrl: PRODUCT_IMAGE_PREVIEW,
        barcode: p.barcode, isActive: p.isActive });
    } else {
      await Api.products.create({ name, brand, categoryId, purchasePrice, sellingPrice, quantity, unit,
        lowStockThreshold, expirationDate: expRaw ? new Date(expRaw).toISOString() : null, imageUrl: PRODUCT_IMAGE_PREVIEW,
        qrCode: genQrValue(), barcode: null, isActive: true });
    }
    DB.products = await Api.products.list();
    closeModal(); toast("Produit enregistré."); renderProduits();
  } catch (err) { toast(err.message, "danger"); }
}
async function deleteProduct(id) {
  if (!confirm("Supprimer ce produit ? Il ne sera plus visible dans le catalogue.")) return;
  try {
    await Api.products.remove(id);
    DB.products = await Api.products.list();
    toast("Produit supprimé."); renderProduits();
  } catch (err) { toast(err.message, "danger"); }
}
// L'impression d'étiquette individuelle réutilise le générateur du module "ÉTIQUETTES QR EN LOT" ci-dessous.
</script>
<script>
/* ============================================================
   ÉTIQUETTES — sélection multiple, formats standards, options d'affichage,
   aperçu, impression (A4 grille ou rouleau thermique continu) et export PDF
   réel (jsPDF pur, sans html2canvas — QR/codes-barres pré-générés via Promise.all)
   ============================================================ */
let QR_LABELS_SEARCH = "";
let QR_LABELS_SELECTED = {}; // { [productId]: quantité d'étiquettes à imprimer }
let QR_LABEL_FORMAT_KEY = "50x30";
let QR_PRINT_MODE = "a4"; // "a4" (grille A4) | "thermal" (rouleau continu 58/80mm)
let QR_LABEL_OPTIONS = { name: true, price: true, currency: true, qr: true, sku: true, barcode: false };

const LABEL_FORMATS = {
  "40x25": { w: 40, h: 25, label: "40 × 25 mm" },
  "50x30": { w: 50, h: 30, label: "50 × 30 mm" },
  "58x40": { w: 58, h: 40, label: "58 × 40 mm" },
  "60x40": { w: 60, h: 40, label: "60 × 40 mm" },
  "80x50": { w: 80, h: 50, label: "80 × 50 mm" },
};
const A4_W_MM = 210, A4_H_MM = 297, PAGE_MARGIN_MM = 8, LABEL_GAP_MM = 2;

// Affiche une erreur à l'écran (toast) ET dans la console avec le détail complet, pour ne jamais échouer "en silence"
function reportError(context, err) {
  console.error(`[Étiquettes] ${context} :`, err);
  toast(`Erreur — ${context} : ${err && err.message ? err.message : err}`, "danger");
}

// Vérifie que toutes les bibliothèques nécessaires sont bien chargées AVANT de lancer une impression/génération
function checkLabelLibraries() {
  const missing = [];
  if (typeof QRCode === "undefined") missing.push("QRCode.js (génération des QR codes)");
  if (!window.jspdf || !window.jspdf.jsPDF) missing.push("jsPDF (génération du PDF)");
  if (QR_LABEL_OPTIONS.barcode && typeof JsBarcode === "undefined") missing.push("JsBarcode (génération des codes-barres)");
  if (missing.length) {
    reportError("bibliothèques manquantes", `Non chargée(s) : ${missing.join(", ")}. Vérifie la connexion internet puis recharge la page.`);
    return false;
  }
  return true;
}

function filteredQrProducts() {
  return DB.products.filter(p => p.isActive && p.name.toLowerCase().includes(QR_LABELS_SEARCH.toLowerCase()));
}

function gridColumns(format) {
  const usableW = A4_W_MM - PAGE_MARGIN_MM * 2;
  return Math.max(1, Math.floor((usableW + LABEL_GAP_MM) / (format.w + LABEL_GAP_MM)));
}
function gridRows(format) {
  const usableH = A4_H_MM - PAGE_MARGIN_MM * 2;
  return Math.max(1, Math.floor((usableH + LABEL_GAP_MM) / (format.h + LABEL_GAP_MM)));
}
function labelsPerPage(format) {
  return gridColumns(format) * gridRows(format);
}

function renderEtiquettesQR() {
  const root = document.getElementById("page-root");
  const filtered = filteredQrProducts();
  const selectedCount = Object.keys(QR_LABELS_SELECTED).length;
  const totalLabels = Object.values(QR_LABELS_SELECTED).reduce((s, q) => s + q, 0);
  const allFilteredSelected = filtered.length > 0 && filtered.every(p => QR_LABELS_SELECTED[p.id] != null);
  const format = LABEL_FORMATS[QR_LABEL_FORMAT_KEY];
  const perPage = labelsPerPage(format);
  const o = QR_LABEL_OPTIONS;

  root.innerHTML = `
    <div class="space-y-4">
      <div class="card p-4">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
          <input id="qr-search" class="input sm:max-w-xs" placeholder="Rechercher un produit..." value="${QR_LABELS_SEARCH}" />
          <label class="flex items-center gap-2 text-sm shrink-0">
            <input type="checkbox" ${allFilteredSelected ? "checked" : ""} onchange="toggleSelectAllFiltered(this.checked)" />
            Tous les produits (${filtered.length})
          </label>
          <div class="flex flex-wrap gap-2 sm:ml-auto">
            <button class="btn-ghost !px-2 !py-1 text-xs" onclick="quickSelect(1)">1 produit</button>
            <button class="btn-ghost !px-2 !py-1 text-xs" onclick="quickSelect(2)">2 produits</button>
            <button class="btn-ghost !px-2 !py-1 text-xs" onclick="quickSelect(4)">4 produits</button>
            <button class="btn-ghost !px-2 !py-1 text-xs" onclick="quickSelect(10)">10 produits</button>
            <button class="btn-ghost !px-2 !py-1 text-xs" onclick="quickSelect(Infinity)">Tous</button>
            <button class="btn-ghost !px-2 !py-1 text-xs" onclick="toggleSelectAllFiltered(false)">Désélectionner tout</button>
          </div>
        </div>
      </div>

      <div class="card p-4">
        <h2 class="font-display font-semibold text-sm mb-3">Mise en page de l'étiquette</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div>
            <label class="label">Format d'étiquette</label>
            <select id="qr-format" class="input">
              ${Object.entries(LABEL_FORMATS).map(([key, f]) => `<option value="${key}" ${key === QR_LABEL_FORMAT_KEY ? "selected" : ""}>${f.label}</option>`).join("")}
            </select>
          </div>
          <div>
            <label class="label">Mode d'impression</label>
            <select id="qr-print-mode" class="input">
              <option value="a4" ${QR_PRINT_MODE === "a4" ? "selected" : ""}>Feuille A4 (grille)</option>
              <option value="thermal" ${QR_PRINT_MODE === "thermal" ? "selected" : ""}>Imprimante thermique (rouleau continu)</option>
            </select>
          </div>
          <div class="col-span-2">
            <label class="label">Informations affichées sur l'étiquette</label>
            <div class="flex flex-wrap gap-x-4 gap-y-1.5 text-sm pt-1.5">
              <label class="flex items-center gap-1.5"><input type="checkbox" ${o.name ? "checked" : ""} onchange="setLabelOption('name', this.checked)" /> Nom</label>
              <label class="flex items-center gap-1.5"><input type="checkbox" ${o.price ? "checked" : ""} onchange="setLabelOption('price', this.checked)" /> Prix</label>
              <label class="flex items-center gap-1.5"><input type="checkbox" ${o.currency ? "checked" : ""} onchange="setLabelOption('currency', this.checked)" /> Devise</label>
              <label class="flex items-center gap-1.5"><input type="checkbox" ${o.qr ? "checked" : ""} onchange="setLabelOption('qr', this.checked)" /> QR Code</label>
              <label class="flex items-center gap-1.5"><input type="checkbox" ${o.sku ? "checked" : ""} onchange="setLabelOption('sku', this.checked)" /> Code produit (SKU)</label>
              <label class="flex items-center gap-1.5"><input type="checkbox" ${o.barcode ? "checked" : ""} onchange="setLabelOption('barcode', this.checked)" /> Code-barres</label>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="p-4 border-b border-border">
          <h2 class="font-display font-semibold text-sm">Sélection des produits (${selectedCount} sélectionné(s) · ${totalLabels} étiquette(s) au total${QR_PRINT_MODE === "a4" && totalLabels > 0 ? ` · ${Math.ceil(totalLabels / perPage)} page(s) A4` : ""})</h2>
        </div>
        <div class="max-h-96 overflow-y-auto divide-y divide-border">
          ${filtered.map(p => {
            const checked = QR_LABELS_SELECTED[p.id] != null;
            const qty = QR_LABELS_SELECTED[p.id] ?? 1;
            return `<div class="flex items-center gap-3 px-4 py-2.5">
              <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleProductSelection('${p.id}', this.checked)" />
              <div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">${p.name}</p><p class="text-xs text-ink-400 font-mono">${fmtGNF(p.sellingPrice)} · ${p.qrCode}</p></div>
              <div class="shrink-0 flex items-center gap-1.5">
                <label class="text-xs text-ink-400">Étiquettes</label>
                <input type="number" min="1" class="input !w-20 !py-1" value="${qty}" ${checked ? "" : "disabled"} onchange="setLabelQuantity('${p.id}', this.value)" />
              </div>
            </div>`;
          }).join("") || `<p class="text-sm text-ink-400 text-center py-8">Aucun produit trouvé.</p>`}
        </div>
      </div>

      <div class="card p-4 flex flex-wrap items-center justify-between gap-3">
        <p class="text-sm text-ink-600">${format.label} · ${QR_PRINT_MODE === "a4" ? `A4 portrait, ${gridColumns(format)} colonne(s) × ${gridRows(format)} ligne(s) par page` : "rouleau thermique continu (XPrinter / Epson / Sunmi / POS58 / POS80)"}</p>
        <div class="flex gap-2">
          <button id="btn-labels-preview" class="btn-ghost" onclick="generateLabelsPreview()">Aperçu avant impression</button>
          <button id="btn-labels-print" class="btn-accent" onclick="printLabelsA4()">🖨️ Imprimer</button>
          <button id="btn-labels-pdf" class="btn-primary" onclick="downloadLabelsPdf()">⬇️ Télécharger en PDF</button>
        </div>
      </div>

      <div id="labels-preview-wrap"></div>
    </div>`;

  document.getElementById("qr-search").addEventListener("input", (e) => { QR_LABELS_SEARCH = e.target.value; renderEtiquettesQR(); });
  document.getElementById("qr-format").addEventListener("change", (e) => { QR_LABEL_FORMAT_KEY = e.target.value; renderEtiquettesQR(); });
  document.getElementById("qr-print-mode").addEventListener("change", (e) => { QR_PRINT_MODE = e.target.value; renderEtiquettesQR(); });
}

function setLabelOption(key, value) {
  QR_LABEL_OPTIONS[key] = value;
}
function toggleProductSelection(id, checked) {
  if (checked) QR_LABELS_SELECTED[id] = QR_LABELS_SELECTED[id] || 1;
  else delete QR_LABELS_SELECTED[id];
  renderEtiquettesQR();
}
function setLabelQuantity(id, value) {
  const qty = Math.max(1, Number(value) || 1);
  if (QR_LABELS_SELECTED[id] != null) QR_LABELS_SELECTED[id] = qty;
}
function toggleSelectAllFiltered(checked) {
  const list = filteredQrProducts();
  if (checked) list.forEach(p => { QR_LABELS_SELECTED[p.id] = QR_LABELS_SELECTED[p.id] || 1; });
  else list.forEach(p => { delete QR_LABELS_SELECTED[p.id]; });
  renderEtiquettesQR();
}
function quickSelect(n) {
  const list = filteredQrProducts();
  QR_LABELS_SELECTED = {};
  list.slice(0, n === Infinity ? list.length : n).forEach(p => { QR_LABELS_SELECTED[p.id] = 1; });
  renderEtiquettesQR();
}

// Le QR produit contient STRICTEMENT le code produit (SKU) — rien d'autre, aucun JSON, aucun champ additionnel.
// Garantit un contenu identique à l'écran et sur l'étiquette : DB.products[].qrCode === contenu du QR, point final.
function buildQrPayload(p) {
  return p.qrCode;
}

function fmtNumberOnly(v) {
  return new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 }).format(v || 0);
}

// Génère le QR d'un produit en Canvas réel (jamais de simple "image" simulée), avec détail d'erreur complet en console.
// Le code produit (quelques caractères) tient toujours très largement en version 1 — pas de repli nécessaire.
async function generateProductQr(p) {
  try {
    const canvas = document.createElement("canvas");
    await QRCode.toCanvas(canvas, buildQrPayload(p), { width: 300, margin: 4, errorCorrectionLevel: "M" });
    return canvas.toDataURL("image/png");
  } catch (err) {
    console.error(`[Étiquettes] Échec de génération du QR pour "${p.name}" (id=${p.id}, code=${p.qrCode}) — vérifie que le moteur QR interne est bien chargé :`, err);
    return null;
  }
}

// Génère le code-barres (CODE128) d'un produit en Canvas réel, avec détail d'erreur complet en console
function generateProductBarcode(p) {
  if (typeof JsBarcode === "undefined") {
    console.error(`[Étiquettes] JsBarcode n'est pas chargé — impossible de générer le code-barres de "${p.name}".`);
    return null;
  }
  const value = (p.barcode || p.qrCode || "").toString();
  if (!value) return null;
  try {
    const canvas = document.createElement("canvas");
    JsBarcode(canvas, value, { format: "CODE128", displayValue: false, margin: 0, height: 50, width: 2 });
    return canvas.toDataURL("image/png");
  } catch (err) {
    console.error(`[Étiquettes] Échec génération code-barres pour "${p.name}" (valeur="${value}") :`, err);
    return null;
  }
}

// Construit la liste à plat des étiquettes à produire, avec QR/code-barres PRÉ-générés en parallèle (Promise.all)
// AVANT toute création de PDF ou d'impression — jamais de génération "à la volée" pendant le rendu.
async function buildLabelsData() {
  const entries = Object.entries(QR_LABELS_SELECTED);
  if (entries.length === 0) return [];
  const uniqueProducts = entries.map(([id]) => DB.products.find(p => p.id === id)).filter(Boolean);
  const t0 = performance.now();

  const qrCache = {};
  const barcodeCache = {};
  let qrFailures = 0;

  if (QR_LABEL_OPTIONS.qr) {
    await Promise.all(uniqueProducts.map(async (p) => {
      const dataUrl = await generateProductQr(p);
      if (!dataUrl) qrFailures++;
      qrCache[p.id] = dataUrl;
    }));
    const dt = (performance.now() - t0).toFixed(1);
    console.log(`✔ QR générés : ${uniqueProducts.length - qrFailures}/${uniqueProducts.length} produit(s) uniques · ✔ Temps total : ${dt} ms · ✔ Échecs : ${qrFailures}`);
  }
  if (QR_LABEL_OPTIONS.barcode) {
    uniqueProducts.forEach(p => { barcodeCache[p.id] = generateProductBarcode(p); });
  }
  if (qrFailures > 0) {
    toast(`${qrFailures} QR code(s) n'ont pas pu être générés — voir la console (F12) pour le détail.`, "danger");
  }

  const items = [];
  entries.forEach(([productId, qty]) => {
    const p = DB.products.find(pr => pr.id === productId);
    if (!p) return;
    for (let i = 0; i < Math.max(1, Number(qty) || 1); i++) {
      items.push({ product: p, qrDataUrl: qrCache[productId] || null, barcodeDataUrl: barcodeCache[productId] || null });
    }
  });
  return items;
}

function paginateLabels(items, perPage) {
  const pages = [];
  for (let i = 0; i < items.length; i += perPage) pages.push(items.slice(i, i + perPage));
  return pages.length ? pages : [[]];
}

// CSS de rendu HTML (aperçu + fenêtre d'impression) — dimensions dynamiques selon le format choisi
function buildLabelCss(format, mode) {
  const base = `
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #fff; }
    .label {
      width: ${format.w}mm; height: ${format.h}mm;
      border: 1px dashed #ccc; border-radius: 1mm; box-sizing: border-box;
      padding: 1.5mm; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; overflow: hidden; page-break-inside: avoid; break-inside: avoid; background: #fff;
    }
    .label-name { font-weight: 700; margin: 0; line-height: 1.15; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: ${(format.w * 0.16).toFixed(1)}px; }
    .label-price { font-weight: 800; margin: 0.6mm 0; line-height: 1; font-size: ${(format.w * 0.30).toFixed(1)}px; }
    .label-currency { font-weight: 600; font-size: ${(format.w * 0.12).toFixed(1)}px; margin-left: 1mm; }
    .label-qr { width: ${(format.h * 0.5).toFixed(1)}mm; height: ${(format.h * 0.5).toFixed(1)}mm; margin: 0.6mm 0; }
    .label-qrmissing { width: ${(format.h * 0.5).toFixed(1)}mm; height: ${(format.h * 0.5).toFixed(1)}mm; margin: 0.6mm 0; border: 1px solid #DC2626; color: #DC2626; font-size: 5px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; }
    .label-barcode { width: 90%; max-height: ${(format.h * 0.22).toFixed(1)}mm; object-fit: contain; margin: 0.5mm 0; }
    .label-sku { font-size: ${Math.max(5, format.w * 0.09).toFixed(1)}px; font-family: 'Courier New', monospace; color: #444; margin: 0; }
  `;
  if (mode === "thermal") {
    return base + `
      body { padding: 2mm; }
      .sheet { display: flex; flex-direction: column; align-items: center; gap: ${LABEL_GAP_MM}mm; }
      @page { size: ${format.w + 4}mm auto; margin: 2mm; }
    `;
  }
  return base + `
    body { padding: ${PAGE_MARGIN_MM}mm; }
    .sheet { display: grid; grid-template-columns: repeat(${gridColumns(format)}, ${format.w}mm); gap: ${LABEL_GAP_MM}mm; justify-content: start; }
    @page { size: A4 portrait; margin: ${PAGE_MARGIN_MM}mm; }
  `;
}

// Rendu HTML d'une étiquette (aperçu + impression navigateur) — jamais d'image produit, uniquement texte + QR/code-barres réels
function labelMarkup({ product: p, qrDataUrl, barcodeDataUrl }, format) {
  const o = QR_LABEL_OPTIONS;
  const priceText = `${fmtNumberOnly(p.sellingPrice)}${o.currency ? ` <span class="label-currency">GNF</span>` : ""}`;
  return `
    <div class="label">
      ${o.name ? `<p class="label-name">${p.name}</p>` : ""}
      ${o.price ? `<p class="label-price">${priceText}</p>` : ""}
      ${o.qr ? (qrDataUrl ? `<img class="label-qr" src="${qrDataUrl}" />` : `<div class="label-qrmissing">⚠ Erreur QR<br>(voir console)</div>`) : ""}
      ${o.barcode && barcodeDataUrl ? `<img class="label-barcode" src="${barcodeDataUrl}" />` : ""}
      ${o.sku ? `<p class="label-sku">${p.qrCode}</p>` : ""}
    </div>`;
}

async function generateLabelsPreview() {
  const btn = document.getElementById("btn-labels-preview");
  if (!checkLabelLibraries()) return;
  try {
    if (btn) btn.disabled = true;
    const format = LABEL_FORMATS[QR_LABEL_FORMAT_KEY];
    const items = await buildLabelsData();
    if (items.length === 0) { toast("Sélectionne au moins un produit.", "danger"); return; }
    const wrap = document.getElementById("labels-preview-wrap");
    const css = buildLabelCss(format, QR_PRINT_MODE);
    if (QR_PRINT_MODE === "thermal") {
      wrap.innerHTML = `
        <div class="card p-4 overflow-x-auto space-y-2">
          <p class="text-xs text-ink-400">${items.length} étiquette(s) — mode rouleau thermique continu (${format.label}).</p>
          <style>${css}</style>
          <div class="sheet" style="border:1px solid #E6EAF2; padding:3mm;">${items.map(it => labelMarkup(it, format)).join("")}</div>
        </div>`;
    } else {
      const perPage = labelsPerPage(format);
      const pages = paginateLabels(items, perPage);

        <div class="card p-4 overflow-x-auto space-y-4">
          <p class="text-xs text-ink-400">${items.length} étiquette(s) sur ${pages.length} page(s) A4 (${format.label}, ${gridColumns(format)} × ${gridRows(format)} par page).</p>
          <style>${css}</style>
          ${pages.map((pageItems, idx) => `
            <div>
              <p class="text-xs font-medium text-ink-600 mb-1">Page ${idx + 1} / ${pages.length}</p>
              <div class="sheet" style="border:1px solid #E6EAF2; padding:4mm;">${pageItems.map(it => labelMarkup(it, format)).join("")}</div>
            </div>`).join("")}
        </div>`;
    }
    toast("Aperçu généré.");
  } catch (err) {
    reportError("génération de l'aperçu", err);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function printLabelsA4() {
  // La fenêtre doit être ouverte de façon SYNCHRONE, dans le même clic utilisateur,
  // sinon le navigateur bloque le popup une fois qu'on est passé par un "await" (async).
  const win = window.open("", "_blank", "width=900,height=700");
  if (!win) { toast("Le navigateur a bloqué la fenêtre d'impression. Autorise les popups pour ce site puis réessaie.", "danger"); return; }
  win.document.write(`<html><head><title>Étiquettes</title></head><body style="font-family:sans-serif;padding:24px;color:#475467;">Génération des étiquettes en cours…</body></html>`);
  win.document.close();

  if (!checkLabelLibraries()) { win.close(); return; }

  const btn = document.getElementById("btn-labels-print");
  try {
    if (btn) btn.disabled = true;
    const format = LABEL_FORMATS[QR_LABEL_FORMAT_KEY];
    const items = await buildLabelsData();
    if (items.length === 0) { win.close(); toast("Sélectionne au moins un produit.", "danger"); return; }
    const css = buildLabelCss(format, QR_PRINT_MODE);
    let bodyHtml;
    if (QR_PRINT_MODE === "thermal") {
      bodyHtml = `<div class="sheet">${items.map(it => labelMarkup(it, format)).join("")}</div>`;
    } else {
      const perPage = labelsPerPage(format);
      const pages = paginateLabels(items, perPage);
      bodyHtml = pages.map((pageItems, idx) =>
        `<div class="sheet"${idx < pages.length - 1 ? ' style="page-break-after: always;"' : ""}>${pageItems.map(it => labelMarkup(it, format)).join("")}</div>`
      ).join("");
    }
    win.document.open();
    win.document.write(`<html><head><title>Étiquettes</title><style>${css}</style></head>
      <body>${bodyHtml}
      <script>window.onload = () => window.print();<\/script>
      </body></html>`);
    win.document.close();
  } catch (err) {
    reportError("impression des étiquettes", err);
    try { win.close(); } catch (e) {}
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Dessine UNE étiquette directement dans le PDF avec les primitives natives de jsPDF (texte + image QR/code-barres déjà en Data URL).
// Aucune capture DOM (pas de html2canvas) : reste rapide même avec des milliers d'étiquettes.
function drawLabelOnPdf(pdf, item, x0, y0, w, h) {
  const o = QR_LABEL_OPTIONS;
  const cx = x0 + w / 2;
  let cursorY = y0 + 2.5;

  pdf.setDrawColor(200, 200, 200);
  pdf.setLineWidth(0.1);
  if (typeof pdf.setLineDashPattern === "function") pdf.setLineDashPattern([0.7, 0.7], 0);
  pdf.rect(x0, y0, w, h);
  if (typeof pdf.setLineDashPattern === "function") pdf.setLineDashPattern([], 0);
  pdf.setTextColor(20, 20, 20);

  if (o.name) {
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(Math.max(6, w * 0.85));
    let name = item.product.name;
    const maxWidth = w - 4;
    while (pdf.getTextWidth(name) > maxWidth && name.length > 3) name = name.slice(0, -2) + "…";
    pdf.text(name, cx, cursorY + 2, { align: "center" });
    cursorY += 4.5;
  }
  if (o.price) {
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(Math.max(11, w * 0.32));
    const priceStr = fmtNumberOnly(item.product.sellingPrice) + (o.currency ? " GNF" : "");
    pdf.text(priceStr, cx, cursorY + 5, { align: "center" });
    cursorY += 7.5;
  }
  if (o.qr) {
    const qrSize = Math.min(h * 0.42, w * 0.55);
    if (item.qrDataUrl) {
      pdf.addImage(item.qrDataUrl, "PNG", cx - qrSize / 2, cursorY, qrSize, qrSize);
    } else {
      pdf.setDrawColor(220, 38, 38);
      pdf.rect(cx - qrSize / 2, cursorY, qrSize, qrSize);
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(5);
      pdf.setTextColor(220, 38, 38);
      pdf.text("Erreur QR", cx, cursorY + qrSize / 2, { align: "center" });
      pdf.setTextColor(20, 20, 20);
    }
    cursorY += qrSize + 1.2;
  }
  if (o.barcode && item.barcodeDataUrl) {
    const bw = w * 0.85, bh = Math.min(h * 0.16, 7);
    pdf.addImage(item.barcodeDataUrl, "PNG", cx - bw / 2, cursorY, bw, bh);
    cursorY += bh + 1;
  }
  if (o.sku) {
    pdf.setFont("courier", "normal");
    pdf.setFontSize(Math.max(5, w * 0.09));
    pdf.text(item.product.qrCode, cx, y0 + h - 1.3, { align: "center" });
  }
}

// Génère un véritable fichier PDF (jsPDF pur) et déclenche son téléchargement automatique.
// Les QR/codes-barres sont déjà générés (voir buildLabelsData → Promise.all) avant d'arriver ici.
async function downloadLabelsPdf() {
  const btn = document.getElementById("btn-labels-pdf");
  if (!checkLabelLibraries()) return;
  try {
    if (btn) btn.disabled = true;
    const format = LABEL_FORMATS[QR_LABEL_FORMAT_KEY];
    const items = await buildLabelsData();
    if (items.length === 0) { toast("Sélectionne au moins un produit.", "danger"); return; }
    toast(`Génération du PDF (${items.length} étiquette(s))…`);

    const { jsPDF } = window.jspdf;
    const c = DB.company || DEFAULT_COMPANY;
    const baseName = (c.name || "superette").toLowerCase().replace(/[^a-z0-9]+/g, "-");

    if (QR_PRINT_MODE === "thermal") {
      const orientation = format.w >= format.h ? "landscape" : "portrait";
      const pdf = new jsPDF({ unit: "mm", format: [format.w, format.h], orientation });
      items.forEach((item, idx) => {
        if (idx > 0) pdf.addPage([format.w, format.h], orientation);
        drawLabelOnPdf(pdf, item, 0, 0, format.w, format.h);
      });
      pdf.save(`etiquettes-${baseName}-thermique.pdf`);
    } else {
      const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
      const cols = gridColumns(format), rows = gridRows(format);
      const perPage = cols * rows;
      const usedW = cols * format.w + (cols - 1) * LABEL_GAP_MM;
      const usedH = rows * format.h + (rows - 1) * LABEL_GAP_MM;
      const offsetX = Math.max(PAGE_MARGIN_MM, (A4_W_MM - usedW) / 2);
      const offsetY = Math.max(PAGE_MARGIN_MM, (A4_H_MM - usedH) / 2);

      const pages = paginateLabels(items, perPage);
      pages.forEach((pageItems, pageIdx) => {
        if (pageIdx > 0) pdf.addPage();
        pageItems.forEach((item, i) => {
          const col = i % cols, row = Math.floor(i / cols);
          const x = offsetX + col * (format.w + LABEL_GAP_MM);
          const y = offsetY + row * (format.h + LABEL_GAP_MM);
          drawLabelOnPdf(pdf, item, x, y, format.w, format.h);
        });
      });
      pdf.save(`etiquettes-${baseName}-a4.pdf`);
    }
    toast("PDF téléchargé avec succès.");
  } catch (err) {
    reportError("génération du PDF", err);
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Réutilisée par le bouton "Étiquette" de la liste des produits (une seule étiquette, mêmes réglages format/options en cours)
function printLabel(id) {
  const previous = QR_LABELS_SELECTED;
  QR_LABELS_SELECTED = { [id]: 1 };
  printLabelsA4().finally(() => { QR_LABELS_SELECTED = previous; });
}
</script>

<script>
/* ============================================================
   PARAMÈTRES DE L'ENTREPRISE — utilisées sur reçus, étiquettes, QR codes, en-tête
   ============================================================ */
// Convertit un fichier image sélectionné en chaîne Base64 (stockage direct dans localStorage)
// Convertit un fichier image en Base64, en le redimensionnant d'abord via canvas (image "légère").
// Corrige à la source le bug de sauvegarde des paramètres : une photo de téléphone non redimensionnée
// (plusieurs Mo) peut à elle seule dépasser le quota de localStorage et faire échouer l'enregistrement.
function fileToBase64(file, callback, maxDim = 600) {
  if (!file) return callback(null);
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      // PNG conservé pour les logos (transparence) ; JPEG compressé pour les photos produit — le redimensionnement
      // à lui seul réduit déjà le poids de façon drastique (une photo 4000×3000 devient ≤600×450).
      const isPng = file.type === "image/png";
      callback(canvas.toDataURL(isPng ? "image/png" : "image/jpeg", isPng ? undefined : 0.85));
    };
    img.onerror = () => { toast("Image invalide ou corrompue.", "danger"); callback(null); };
    img.src = reader.result;
  };
  reader.onerror = () => { toast("Impossible de lire l'image.", "danger"); callback(null); };
  reader.readAsDataURL(file);
}

}

async function saveCompanySettings() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) return toast("Le nom de l'entreprise est requis.", "danger");
  const newCompany = {
    name,
    ownerName: document.getElementById("f-owner").value.trim(),
    slogan: document.getElementById("f-slogan").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    whatsapp: document.getElementById("f-whatsapp").value.trim(),
    address: document.getElementById("f-address").value.trim(),
    city: document.getElementById("f-city").value.trim(),
    country: document.getElementById("f-country").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    website: document.getElementById("f-website").value.trim(),
    rccm: document.getElementById("f-rccm").value.trim(),
    nif: document.getElementById("f-nif").value.trim(),
    currency: document.getElementById("f-currency").value.trim() || "GNF",
    timezone: document.getElementById("f-timezone").value.trim() || "Africa/Conakry",
    lat: document.getElementById("f-lat").value.trim(),
    lng: document.getElementById("f-lng").value.trim(),
    logo: PARAM_LOGO_PREVIEW,
    printer: {
      type: document.getElementById("f-printer-type").value,
      showLogo: document.getElementById("f-printer-showLogo").checked,
      showName: document.getElementById("f-printer-showName").checked,
      showAddress: document.getElementById("f-printer-showAddress").checked,
      showPhone: document.getElementById("f-printer-showPhone").checked,
      showTaxIds: document.getElementById("f-printer-showTaxIds").checked,
      showCashier: document.getElementById("f-printer-showCashier").checked,
      showDateTime: document.getElementById("f-printer-showDateTime").checked,
      showTicketNumber: document.getElementById("f-printer-showTicketNumber").checked,
      showQr: document.getElementById("f-printer-showQr").checked,
      showThanks: document.getElementById("f-printer-showThanks").checked,
      showTerms: document.getElementById("f-printer-showTerms").checked,
      termsText: document.getElementById("f-printer-termsText").value.trim(),
    },
  };
  try {
    DB.company = await Api.settings.update(newCompany);
    applyCompanyBranding();
    toast("Informations de l'entreprise enregistrées.");
  } catch (err) {
    toast(`Échec de l'enregistrement : ${err.message}`, "danger"); // l'ancien DB.company reste inchangé : jamais de faux succès
  }
}

async function restoreCompanyDefaults() {
  if (!confirm("Restaurer les valeurs par défaut ? Les informations personnalisées de l'entreprise seront effacées.")) return;
  try {
    DB.company = await Api.settings.update({ ...DEFAULT_COMPANY, printer: { ...DEFAULT_COMPANY.printer } });
    applyCompanyBranding();
    renderParametres();
    toast("Valeurs par défaut restaurées.");
  } catch (err) {
    toast(`Échec de la restauration : ${err.message}`, "danger");
  }
}

<script>
/* ============================================================
   UTILISATEURS (réservé ADMIN)
   ============================================================ */
function renderUtilisateurs() {
  const root = document.getElementById("page-root");
  if (!canSeePage(CURRENT_USER, "utilisateurs")) {
    root.innerHTML = `<div class="card p-8 text-center text-sm text-ink-400">🔒 Accès réservé.</div>`;
    return;
  }
  root.innerHTML = `
    <div class="card">
      <div class="flex items-center justify-between p-5 border-b border-border">
        <h2 class="font-display font-semibold text-base">Utilisateurs (${DB.users.length})</h2>
        <button class="btn-primary" onclick="openUserForm()">+ Nouvel utilisateur</button>
      </div>
      <table class="data w-full">
        <thead><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th>Menus autorisés</th><th>Statut</th><th></th></tr></thead>
        <tbody>${DB.users.map(u => `<tr>
          <td class="font-medium">${u.name}</td>
          <td class="text-ink-600 font-mono">${u.email}</td>
          <td><span class="text-xs font-medium px-2 py-1 rounded-full bg-navy-50 text-navy-700">${roleLabel(u.role)}</span></td>
          <td class="text-xs text-ink-400 max-w-[220px]">${u.role === "ADMIN" ? "Accès complet" : (PERMISSION_PAGES.filter(p => canSeePage(u, p.key)).map(p => p.label).join(", ") || "Aucun")}</td>
          <td>${u.isActive ? '<span class="text-xs text-accent-600 font-medium">Actif</span>' : '<span class="text-xs text-ink-400">Inactif</span>'}</td>
          <td class="text-right">
            <button class="btn-ghost !px-2 !py-1" onclick='openUserForm(${JSON.stringify(u.id)})'>Modifier</button>
            ${u.id !== CURRENT_USER.id ? `<button class="btn-danger !px-2 !py-1" onclick="deleteUser('${u.id}')">Supprimer</button>` : ""}
          </td>
        </tr>`).join("")}</tbody>
      </table>
    </div>`;
}
// Génère la liste de cases à cocher des menus, en masquant totalement ceux verrouillés pour ce rôle
// (le Caissier ne doit même pas VOIR une case "Rapports" qu'il ne pourrait de toute façon jamais cocher).
function permissionCheckboxesHtml(role, currentPermissions) {
  const blocked = HARD_BLOCKED_PAGES[role] || [];
  const perms = currentPermissions || DEFAULT_PERMISSIONS_BY_ROLE[role] || [];
  const rows = PERMISSION_PAGES.filter(p => !blocked.includes(p.key)).map(p => `
    <label class="flex items-center gap-1.5 text-sm"><input type="checkbox" class="f-perm" value="${p.key}" ${perms.includes(p.key) ? "checked" : ""} /> ${p.label}</label>`).join("");
  const financialsChecked = role === "GERANT" && perms.includes("financials");
  return `
    <div class="grid grid-cols-2 gap-y-2 gap-x-3">${rows}</div>
    ${role === "GERANT" ? `
      <label class="flex items-center gap-1.5 text-sm pt-2 mt-2 border-t border-border">
        <input type="checkbox" id="f-perm-financials" ${financialsChecked ? "checked" : ""} /> Autoriser à voir les marges et bénéfices (Tableau de bord / Rapports)
      </label>` : ""}
    ${blocked.length ? `<p class="text-xs text-ink-400 pt-2">🔒 ${blocked.map(k => PERMISSION_PAGES.find(p => p.key === k)?.label).join(", ")} : toujours inaccessible pour ce rôle, quelle que soit la configuration.</p>` : ""}`;
}
function refreshPermissionsPanel() {
  const role = document.getElementById("f-role").value;
  const panel = document.getElementById("f-permissions-panel");
  panel.innerHTML = role === "ADMIN"
    ? `<p class="text-sm text-ink-400">L'administrateur a toujours un accès complet et inconditionnel — aucune restriction possible.</p>`
    : permissionCheckboxesHtml(role, DEFAULT_PERMISSIONS_BY_ROLE[role]);
}
function openUserForm(id) {
  const u = id ? DB.users.find(x => x.id === id) : null;
  openModal(u ? "Modifier l'utilisateur" : "Nouvel utilisateur", `
    <div class="space-y-4">
      <div><label class="label">Nom complet</label><input id="f-name" class="input" value="${u?.name || ""}" /></div>
      <div><label class="label">E-mail</label><input id="f-email" type="email" class="input" value="${u?.email || ""}" /></div>
      <div><label class="label">Mot de passe</label><input id="f-password" class="input" placeholder="${u ? "Laisser vide pour ne pas changer" : ""}" /></div>
      <div><label class="label">Rôle</label>
        <select id="f-role" class="input">
          <option value="CAISSIER" ${u?.role === "CAISSIER" ? "selected" : ""}>Caissier</option>
          <option value="GERANT" ${u?.role === "GERANT" ? "selected" : ""}>Gérant</option>
          <option value="ADMIN" ${u?.role === "ADMIN" ? "selected" : ""}>Administrateur</option>
        </select>
      </div>
      <label class="flex items-center gap-2 text-sm"><input id="f-active" type="checkbox" ${u?.isActive !== false ? "checked" : ""} /> Compte actif</label>
      <div class="pt-2 border-t border-border">
        <label class="label mb-2 block">Menus autorisés</label>
        <div id="f-permissions-panel">${u?.role === "ADMIN" ? `<p class="text-sm text-ink-400">L'administrateur a toujours un accès complet et inconditionnel — aucune restriction possible.</p>` : permissionCheckboxesHtml(u?.role || "CAISSIER", u?.permissions)}</div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button class="btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="saveUser(${id ? `'${id}'` : "null"})">Enregistrer</button>
      </div>
    </div>`);
  document.getElementById("f-role").addEventListener("change", () => refreshPermissionsPanel());
}
async function saveUser(id) {
  const name = document.getElementById("f-name").value.trim();
  const email = document.getElementById("f-email").value.trim();
  const password = document.getElementById("f-password").value;
  const role = document.getElementById("f-role").value;
  const isActive = document.getElementById("f-active").checked;
  if (!name || !email) return toast("Nom et e-mail requis.", "danger");
  if (!id && !password) return toast("Un mot de passe est requis à la création.", "danger");
  if (DB.users.some(u => u.email === email && u.id !== id)) return toast("Cet e-mail est déjà utilisé.", "danger");

  let permissions = [];
  if (role !== "ADMIN") {
    permissions = Array.from(document.querySelectorAll(".f-perm:checked")).map(el => el.value);
    if (role === "GERANT" && document.getElementById("f-perm-financials")?.checked) permissions.push("financials");
  }

  try {
    if (id) await Api.users.update(id, { name, email, role, isActive, permissions, password: password || undefined });
    else await Api.users.create({ name, email, role, isActive, permissions, password });
    DB.users = await Api.users.list();
    closeModal(); toast("Utilisateur enregistré."); renderUtilisateurs();
  } catch (err) { toast(err.message, "danger"); }
}
async function deleteUser(id) {
  if (!confirm("Supprimer cet utilisateur ?")) return;
  try {
    await Api.users.remove(id);
    DB.users = await Api.users.list();
    toast("Utilisateur supprimé."); renderUtilisateurs();
  } catch (err) { toast(err.message, "danger"); }
}

/* ============================================================
   STOCK
   ============================================================ */
function renderStock() {
  const root = document.getElementById("page-root");
  const canEdit = CURRENT_USER.role !== "CAISSIER";
  const products = DB.products.filter(p => p.isActive).sort((a, b) => (a.quantity <= a.lowStockThreshold ? -1 : 1));
  root.innerHTML = `
    <div class="card">
      <div class="p-5 border-b border-border"><h2 class="font-display font-semibold text-base">Stock en temps réel (${products.length} produits)</h2></div>
      <table class="data w-full">
        <thead><tr><th>Produit</th><th>Quantité</th><th>Seuil d'alerte</th><th>État</th>${canEdit ? "<th></th>" : ""}</tr></thead>
        <tbody>${products.map(p => {
          const low = p.quantity <= p.lowStockThreshold;
          const expired = p.expirationDate && new Date(p.expirationDate) < new Date();
          return `<tr>
            <td class="font-medium">${p.name}</td>
            <td class="font-mono ${low ? "text-warning font-semibold" : ""}">${p.quantity} ${p.unit}</td>
            <td class="font-mono text-ink-600">${p.lowStockThreshold} ${p.unit}</td>
            <td>${expired ? '<span class="text-xs text-danger font-medium">Périmé</span>' : low ? '<span class="text-xs text-warning font-medium">Stock faible</span>' : '<span class="text-xs text-accent-600 font-medium">Correct</span>'}</td>
            ${canEdit ? `<td class="text-right"><button class="btn-ghost !px-2 !py-1" onclick="openStockAdjust('${p.id}')">Ajuster</button></td>` : ""}
          </tr>`;
        }).join("")}</tbody>
      </table>
    </div>`;
}
function openStockAdjust(id) {
  const p = DB.products.find(x => x.id === id);
  openModal(`Ajuster le stock — ${p.name}`, `
    <p class="text-sm text-ink-600 mb-4">Stock actuel : <span class="font-mono font-semibold">${p.quantity} ${p.unit}</span></p>
    <div class="space-y-4">
      <div><label class="label">Type de mouvement</label>
        <select id="f-type" class="input">
          <option value="ACHAT">Réassort / achat (entrée)</option>
          <option value="PERTE">Perte / produit périmé (sortie)</option>
          <option value="CORRECTION">Correction d'inventaire</option>
        </select>
      </div>
      <div><label class="label">Quantité (positive = entrée, négative = sortie)</label><input id="f-qty" type="number" class="input" value="1" /></div>
      <div><label class="label">Motif (optionnel)</label><input id="f-reason" class="input" /></div>
      <div class="flex justify-end gap-2 pt-2">
        <button class="btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="applyStockAdjust('${id}')">Valider</button>
      </div>
    </div>`);
}
async function applyStockAdjust(id) {
  const type = document.getElementById("f-type").value;
  let qty = Number(document.getElementById("f-qty").value);
  const reason = document.getElementById("f-reason").value.trim();
  if (!qty) return toast("Quantité invalide.", "danger");
  if (type === "PERTE") qty = -Math.abs(qty);
  try {
    await Api.stockMovements.adjust(id, type, qty, reason);
    DB.products = await Api.products.list();
    closeModal(); toast("Stock mis à jour."); renderStock();
  } catch (err) { toast(err.message, "danger"); }
}
</script>
